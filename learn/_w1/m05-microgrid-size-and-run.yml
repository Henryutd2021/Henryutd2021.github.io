id: m05-microgrid-size-and-run
lesson: M5
glossary:
  - id: rolling-horizon
    term: Rolling horizon
    def: "Planning over a window ahead on a forecast, carrying out only the first hours of the plan, then planning again as the real values arrive."
  - id: cost-of-capital
    term: Cost of capital
    def: "The yearly return an owner's lenders and investors require on money tied up in equipment; the real cost of capital leaves inflation out."
  - id: service-level
    term: Service level
    def: "The share of cases in which a rule must hold, such as meeting store demand in 95 of every 100 weeks."
  - id: deterministic-equivalent
    term: Deterministic equivalent
    def: "A chance constraint rewritten as an ordinary rule with a safety margin, for example planning for the demand level that is exceeded with only the allowed probability."
requests:
