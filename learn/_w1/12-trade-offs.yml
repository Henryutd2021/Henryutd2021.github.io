id: 12-trade-offs
lesson: 12
glossary:
  - id: dominated-plan
    term: Dominated plan
    def: "A plan that another plan beats on every count: no more cost, no more emissions, and better on at least one."
  - id: carbon-price
    term: Carbon price
    def: "A charge per tonne of CO2 emitted, added to costs so that cleaner choices become relatively cheaper."
  - id: emissions-cap
    term: Emissions cap
    def: "A limit on the total CO2 that may be emitted in a period, such as a year."
  - id: weighted-sum
    term: Weighted sum
    def: "A way to combine several goals into one score by adding them up, each multiplied by a weight."
  - id: epsilon-constraint
    term: Epsilon-constraint method
    def: "A way to trace a trade-off by optimizing one goal while capping the other, then moving the cap step by step."
