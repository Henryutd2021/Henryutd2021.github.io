id: 05-capacity-factor
lesson: 5
glossary:
  - id: power-curve
    term: Power curve
    def: "A chart of how much power a wind turbine makes at each wind speed."
  - id: cube-law
    term: Cube law
    def: "The power carried by the wind grows with the cube of its speed, so twice the speed carries eight times the power."
  - id: rated-speed
    term: Rated wind speed
    def: "The wind speed at which a turbine first reaches its full rated power; above it, the blades turn to spill the extra wind."
  - id: cut-out-speed
    term: Cut-out speed
    def: "The wind speed above which a turbine shuts down to protect itself."
  - id: refuelling-outage
    term: Refuelling outage
    def: "The planned weeks when a reactor is shut down to replace part of its fuel and carry out maintenance."
