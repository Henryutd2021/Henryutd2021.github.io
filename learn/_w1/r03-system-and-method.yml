# Sidecar of research studio R3 (r03-system-and-method).
# Provenance of assets/learn/data/r03-system-and-method.json: written by hand for the course's research studios (R3),
# its definition of a scale (decisions, authority, physics, inputs, outputs) and its question types and typical
# methods; rubric from the course rubric (assets/learn/components/rubric.js).
lesson: R3
glossary:
  - {id: method-family, term: "Method family", def: "A group of research methods that answer the same kind of question in a similar way, such as optimization, simulation or statistics."}
  - {id: time-step, term: "Time step", def: "The length of one step in a model or dataset, such as five minutes, an hour or a year."}
  - {id: horizon, term: "Horizon", def: "The span of time a study covers, from a day of operation to decades of planning."}
  - {id: monte-carlo, term: "Monte Carlo simulation", def: "A method that runs a calculation many times on randomly drawn inputs and reads the spread of the results."}
  - {id: expected-unserved-energy, term: "Expected unserved energy", def: "Demand left unmet, averaged over many simulated years, in MWh a year: an amount of energy, unlike a load's size in MW."}
  - {id: difference-in-differences, term: "Difference-in-differences", def: "A comparison of how much an outcome changed in a group that got a programme against how much it changed in a similar group that did not."}
