# scripts/build_learn.py. Henry approved the page's excerpt on 2026-11-03 (reports/learn/excerpts_for_approval.md, E7).
id: cf7-cost-of-waiting
lesson: CF7
glossary:
  - id: mw-it
    term: MW-IT
    def: "Megawatts of a data center's computing equipment; the grid must supply more, for cooling and the rest of the building."
  - id: latin-hypercube
    term: Latin hypercube sampling
    def: "A way to draw many sets of uncertain inputs so that the whole range of every input is covered evenly."
  - id: carrying-cost
    term: Carrying cost
    def: "What money tied up in buildings or equipment costs while they earn nothing: the interest, or the return it could have earned elsewhere."
  - id: ratepayer
    term: Ratepayer
    def: "A customer who pays a utility's regulated electricity rates; utility costs that nobody else covers end up in those rates."
  - id: stranded-cost
    term: Stranded cost
    def: "Money already spent on equipment that is no longer used as planned, such as grid upgrades built for a load that never arrives."
  - id: staged-energization
    term: Staged energization
    def: "Switching on part of a large load's grid service early and the rest later, as the grid becomes ready."
  - id: energization
    term: Energization
    def: "Switching on a customer's grid service, so that power can flow to it."
  - id: developer
    term: Developer
    def: "The company that plans, builds and owns a new facility, such as a factory or a data center."
  - id: margin
    term: Margin
    def: "What a business earns from its output after paying its operating costs: revenue minus operating costs."
  - id: tariff
    term: Tariff
    def: "The rule for calculating electricity bills: fixed charges, prices per kWh, or both."
  - id: exogenous
    term: Exogenous
    def: "Set from outside a model as an input, rather than worked out by the model."
  - id: external-cost
    term: External cost
    def: "A cost that falls on people outside a deal, such as the damage from CO₂, which neither the buyer nor the seller pays."
  - id: bridge-power
    term: Bridge power
    def: "Temporary on-site generation that serves part of a load until its grid connection is ready."
  - id: net-benefit-test
    term: Net-benefit test
    def: "A check that an option's total benefits across all affected parties exceed its total costs, each counted once."
