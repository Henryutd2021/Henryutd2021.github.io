glossary:
  - id: public-utility-commission
    term: Public utility commission
    def: "A state's utility regulator (in Kansas, the Kansas Corporation Commission), which sets or approves the rates and service rules of the utilities it oversees."
  - id: investor-owned-utility
    term: Investor-owned utility
    def: "An electric or gas utility owned by shareholders; its retail rates are typically set or approved by the state's utility commission."
  - id: public-power-utility
    term: Public power utility
    def: "An electric utility owned by a city or another public body, generally regulated by its own local government rather than the state commission."
  - id: ferc
    term: FERC (Federal Energy Regulatory Commission)
    def: "The federal regulator of interstate electricity transmission, wholesale power sales and interstate gas pipelines in the United States."
