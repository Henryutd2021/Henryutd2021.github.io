# Sidecar for A7 (a07-flexible-demand). Read by the course build step.
# The real-world box quotes E6.4 and E6.6 (excerpt:ghg) and E8.2, E8.4 with the note E8.7 (excerpt:supply-chain-mg),
# in their approved wording.
id: a07-flexible-demand
lesson: A7
glossary:
  - id: consequential-emissions
    term: Consequential emissions
    def: "The change in what power plants actually emit because of a decision, as the grid re-dispatches; it is counted with marginal, not average, emission factors."
  - id: virtual-power-plant
    term: Virtual power plant
    def: "Many small devices, such as batteries, thermostats and chargers, controlled together and offered to the grid as one resource."
  - id: aggregator
    term: Aggregator
    def: "A company that enrolls many customers' devices, offers their combined response to a grid operator or utility, and shares the payment with the owners."
  - id: coordination-cost
    term: Coordination cost
    def: "What it costs to enroll, meter, control and pay each device or customer in a program, whatever the device's size."
  - id: baseline
    term: Baseline
    def: "An estimate of what a customer would have used without a demand-response event, against which the cut is measured."
  - id: transactive-energy
    term: Transactive energy
    def: "Buying and selling electricity among many small participants, such as homes and firms with their own generation, as well as with the grid."
requests:
  - "A7 reads A4's data file (a04-retail-tariffs.json) for the neighbors' trade, and keeps A4's real-time wires charge in its own data (trade.wires); its test checks the two agree. If A4's tariffs change, rerun both tests."
