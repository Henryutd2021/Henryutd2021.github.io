# Sidecar for CF8 (cf8-power-curves-from-scarce-data). Read by the course build step.
id: cf8-power-curves-from-scarce-data
lesson: CF8
glossary:
  - id: kernel-density-estimate
    term: Kernel density estimate
    def: "A smooth estimate of where data points are dense, made by placing a small bump on every point and adding them up; sampling from it keeps the data's shape with fewer points."
  - id: sharpness
    term: Sharpness (of a forecast band)
    def: "How narrow a forecast's bands are, on average; narrower is better only if the bands still hold what they claim."
  - id: variogram
    term: Variogram
    def: "A measure of how much values at two places differ, on average, as a function of the distance between them; here, across a wind plant's turbines."
