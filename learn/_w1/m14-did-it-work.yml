id: m14-did-it-work
lesson: M14
glossary:
  - id: selection-bias
    term: Selection bias
    def: "A false effect that appears when the people or places that take up a programme differ, before it starts, from those that do not."
  - id: parallel-trends
    term: Parallel trends
    def: "The assumption behind difference-in-differences: without the programme, the treated and comparison groups would have changed by the same amount."
  - id: event-study
    term: Event study
    def: "A difference-in-differences estimated period by period around the start date, so the periods before the start can be checked for parallel trends."
  - id: confounding
    term: Confounding
    def: "When something other than the programme, such as a second change at the same time, also differs between the groups and moves the outcome."
  - id: spillover-effect
    term: Spillover
    def: "When a programme also changes the comparison group, for example neighbours copying a habit or projects moving across a border."
  - id: anticipation-effect
    term: Anticipation
    def: "When people change their behaviour before a programme starts because they know it is coming."
requests:
  - "M14 builds the curriculum row's play on simulated panels with known effects (W5 brief §4 and the task message), not on public data: the row's 'Use public data' (curriculum_v2.md §7.5, learn_map_v2.yml play) could read 'Use simulated panels with a known effect, then read a public study'. Real programme evidence comes from DOE's November 2016 consumer behaviour studies report (energy.gov)."
