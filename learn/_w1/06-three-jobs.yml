# Sidecar for lesson 6 (T6, 06-three-jobs), builder learn-w1-c, 2026-11-02. Read by scripts/build_learn.py.
id: 06-three-jobs
lesson: 6
glossary:
  - id: flexibility
    term: Flexibility
    def: "The ability of a plant, a store or a group of users to raise or lower power quickly when the grid asks."
  - id: firm-share
    term: Firm share (ELCC)
    def: "The part of a plant's capacity that a grid counts on in its riskiest hours, often estimated as its effective load-carrying capability (ELCC)."
  - id: demand-response
    term: Demand response
    def: "Electricity users cutting or shifting their use when the grid asks, usually in return for a payment."
