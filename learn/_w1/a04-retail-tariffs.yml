# Sidecar for A4 (a04-retail-tariffs). Read by the course build step.
# The real-world box quotes E7.6 (excerpt:code) in its approved wording.
# customer-class is defined here so that "class" is defined at its first use.
id: a04-retail-tariffs
lesson: A4
glossary:
  - id: demand-charge
    term: Demand charge
    def: "A part of a power bill charged per kW of the customer's busiest hour (or interval) in the month, not per kWh."
  - id: net-metering
    term: Net metering
    def: "A billing rule under which each kWh a customer sends back to the grid earns the same price as a kWh it buys."
  - id: net-billing
    term: Net billing
    def: "A billing rule under which kWh sent back to the grid earn a credit set separately from the retail price, often the value of energy in that hour."
  - id: real-time-pricing
    term: Real-time pricing
    def: "A tariff whose price per kWh follows the wholesale or system price hour by hour, so the bill moves with it."
  - id: cost-of-service
    term: Cost of service
    def: "What it costs a utility to serve a customer or a class of customers: energy, plants, wires, meters and billing."
  - id: cross-subsidy
    term: Cross-subsidy
    def: "When some customers pay more than the cost of serving them so that others can pay less."
  - id: large-load-tariff
    term: Large-load tariff
    def: "A tariff for very large new customers, such as data centers or factories, with terms that protect other customers if the load uses less than it promised."
  - id: minimum-billing-demand
    term: Minimum billing demand
    def: "The least demand, often a share of the contracted kW or MW, that a customer is billed for each month however low its demand."
  - id: customer-class
    term: Customer class
    def: "A group of customers, such as homes or businesses, that a utility bills under the same tariffs."
requests:
  - "Ledger table: a04-retail-tariffs.js builds the e-ledger as a table.cf-two (rows: parties, columns: options, cells: signed $ with 'above'/'below' words, no colour tones); A7 builds the same for owners and neighbours. A shared LX.Ledger (i-ledger/e-ledger) serves both, with a staticHTML for the no-JS block."
