# Sidecar for A11 (a11-lca-nexus). Read by the course build step.
id: a11-lca-nexus
lesson: A11
glossary:
  - id: functional-unit
    term: Functional unit
    def: "The amount of service a footprint is counted per, such as one kWh made or one MWh used, so that options are compared on the same service."
  - id: water-withdrawal
    term: Water withdrawal
    def: "Water taken from a river, lake or aquifer, of which the part not returned is consumption; how much returns depends on the cooling system."
  - id: water-consumption
    term: Water consumption
    def: "Water taken and not returned, mostly lost to evaporation, so it is no longer available downstream."
  - id: land-use-intensity
    term: Land-use intensity
    def: "The land a plant holds for each unit of energy it makes in a year, here square metres per MWh a year."
  - id: attributional-analysis
    term: Attributional analysis
    def: "An analysis that gives a product its share of today's burdens from average data, so the shares of all products add up."
  - id: interquartile-range
    term: Interquartile range
    def: "The middle half of a set of values, from the 25th to the 75th percentile."
