# Sidecar for lesson 3 (T3, 03-balancing), builder learn-w1-b, 2026-11-02. Read by scripts/build_learn.py.
id: 03-balancing
lesson: 3
glossary:
  - id: inertia
    term: Inertia
    def: "Energy stored in the spinning machines of a power grid; it slows a fall in frequency but cannot stop it."
  - id: rocof
    term: Rate of change of frequency
    def: "How fast the grid's frequency moves in the first instant after a disturbance, in hertz per second."
  - id: nadir
    term: Nadir
    def: "The lowest point the frequency reaches after a power plant trips, before it starts to recover."
  - id: primary-response
    term: Primary frequency response
    def: "Automatic extra output from power plants' governors within seconds of a frequency drop; it stops the fall but does not restore 60 Hz."
  - id: governor
    term: Governor
    def: "A plant's speed control that opens or closes its steam, gas or water valves as the grid frequency changes."
  - id: agc
    term: Automatic generation control (AGC)
    def: "The grid operator's computer system that raises or lowers plants over minutes to bring frequency back to 60 Hz."
  - id: ufls
    term: Under-frequency load shedding
    def: "Relays that automatically disconnect blocks of customers when the frequency falls to a set level, to save the rest of the grid."
  - id: fast-frequency-response
    term: Fast frequency response
    def: "Power from batteries or other inverter-based resources delivered within a fraction of a second of a frequency drop."
  - id: inverter
    term: Inverter
    def: "Power electronics that convert the direct current of solar panels and batteries, or a wind turbine's varying output, into the grid's alternating current."
  - id: load-relief
    term: Load relief
    def: "The small drop in demand when the frequency falls, because many motors turn a little slower and draw less power."
