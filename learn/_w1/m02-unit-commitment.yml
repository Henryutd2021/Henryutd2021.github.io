lesson: M2
glossary:
  - id: lp-relaxation
    term: LP relaxation
    def: "The same model with every whole-number decision allowed to take any value in between, such as a switch anywhere from 0 to 1; its best cost is a lower bound for the real model."
  - id: lower-bound
    term: Lower bound
    def: "A value the best answer cannot fall below; in a cost-minimising model, the cost of a relaxation is one."
  - id: branch-and-bound
    term: Branch and bound
    def: "A search for the best whole-number plan that solves relaxations, splits on a fractional decision (off or on), and drops every branch whose bound cannot beat the best plan found."
  - id: minimum-stable-output
    term: Minimum stable output
    def: "The lowest output at which a running plant can operate steadily; below it the plant must switch off."
  - id: start-up-cost
    term: Start-up cost
    def: "The fuel and wear spent to bring a plant from off to on, paid once per start."
  - id: no-load-cost
    term: No-load cost
    def: "What a plant costs for each hour it is on, before it makes any power."
  - id: minimum-run-time
    term: Minimum run time
    def: "The hours a plant must stay on once started; the minimum down time is the hours it must stay off once stopped."
  - id: minimum-down-time
    term: Minimum down time
    def: "The hours a plant must stay off once stopped before it may start again."
  - id: conditional-price
    term: Conditional price
    def: "A price read from a linear program in which the on/off decisions are held fixed; it holds only for that commitment."
  - id: uplift
    term: Uplift payment
    def: "A payment outside the market price that covers costs a scheduled plant cannot recover at the price, such as start-up and no-load costs; also called a make-whole payment."
