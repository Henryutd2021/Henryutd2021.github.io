# Sidecar for A21 (a21-security-minerals). Read by the course build step.
id: a21-security-minerals
lesson: A21
glossary:
  # import-dependence: one definition, in F10's sidecar (it is taught there first)
  - id: hhi
    term: Herfindahl-Hirschman index (HHI)
    def: "A measure of how concentrated a supply is: the sum of each supplier's squared percentage share, from near 0 for many small suppliers to 10,000 for one."
  - id: gdp
    term: Gross domestic product (GDP)
    def: "The value of all the goods and services an economy produces in a year."
  - id: petajoule
    term: Petajoule (PJ)
    def: "A unit of energy equal to a million gigajoules (10^15 joules, about 278 GWh), used for a country's yearly fuel use."
