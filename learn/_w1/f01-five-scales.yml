# Sidecar for F1 (f01-five-scales). Read by the course build step.
id: f01-five-scales
lesson: F1
glossary:
  - id: system-scale
    term: Scale (of an energy system)
    def: "A level of an energy system, from one device or plant to a whole nation, set apart by who decides what and by the physics a model of it needs."
  - id: microgrid
    term: Microgrid
    def: "Loads and sources inside one electrical boundary, such as a campus or a village, run as one system; a grid-connected microgrid can disconnect and run alone, and an isolated one always does."
  - id: islanding
    term: Islanding
    def: "A microgrid or part of a grid disconnecting from the main grid and keeping its own loads supplied."
  - id: feeder
    term: Feeder
    def: "A distribution line that carries power from a substation to the homes and businesses along it."
  - id: tariff
    term: Tariff
    def: "The rule for calculating electricity bills: fixed charges, prices per kWh, or both."
  - id: synchronous-grid
    term: Synchronous grid
    def: "A connected AC network whose generators and other equipment run at one shared electrical frequency; the Lower 48 states have three main ones, called interconnections."
  - id: building-code
    term: Building code
    def: "The rules a city, county or state sets for how new buildings must be built, such as insulation, wiring and safety."
requests:
  - "Promote two lesson-local components if later lessons want them: ScaleZoom (assets/learn/f01-five-scales.js: a powers-of-ten zoom through five drawn scenes with a keyboard rail, Zoom in/out and a text version; the scenes use only --lx-* tokens) and ScaleStrip (e-scale-strip: five scales with the reader's sort ticks, signals passed down and needs passed up, lessons per scale). Lesson 1's t1-strip could then use ScaleStrip."
