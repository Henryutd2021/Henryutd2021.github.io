id: f01-five-scales
lesson: F1
glossary:
  - id: system-scale
    term: Scale (of an energy system)
    def: "A level of an energy system, from one device or plant to a whole nation, set apart by who decides what and by the physics a model of it needs."
  - id: microgrid
    term: Microgrid
    def: "A local group of loads and sources, such as a campus or a village, that is managed as one system and can disconnect from the main grid and run on its own."
  - id: islanding
    term: Islanding
    def: "A microgrid or part of a grid disconnecting from the main grid and keeping its own loads supplied."
  - id: feeder
    term: Feeder
    def: "A distribution line that carries power from a substation to the homes and businesses along it."
  - id: local-optimum
    term: Local optimum
    def: "The best plan for one part of a system judged inside its own boundary, which need not be best for the system it sits in."
  - id: tariff
    term: Tariff
    def: "The set of prices a utility charges its customers for electricity, such as a price per kWh, a fixed monthly charge or a different price at different hours."
  - id: synchronous-grid
    term: Synchronous grid
    def: "A grid that runs at one shared frequency, so every spinning generator in it turns in step; the Lower 48 states have three main ones, called interconnections."
  - id: building-code
    term: Building code
    def: "The rules a city, county or state sets for how new buildings must be built, such as insulation, wiring and safety."
