# Sidecar for CF4 (cf4-existing-reactors-hydrogen). Read by the course build step. Depth D2 (working knowledge),
# closed-form toy, as CF5-CF8. Glossary: the six terms CF4 teaches, each marked at its first use on the page;
# ancillary-services is CF5's (its sidecar defines it, in the same wording), so CF4 only marks it.
id: cf4-existing-reactors-hydrogen
lesson: CF4
glossary:
  - id: sunk-cost
    term: Sunk cost
    def: "Money already spent that no choice made now can change, such as what an existing plant cost to build; it drops out when options are compared."
  - id: price-taker
    term: Price-taker
    def: "A seller or buyer too small to move the market price, so a model takes the prices as given."
  - id: piecewise-linear
    term: Piecewise-linear curve
    def: "A curve drawn as straight pieces joined end to end, so a linear or mixed-integer program can follow it."
  - id: minimum-up-down-time
    term: Minimum up and down times
    def: "The shortest time a unit must stay on once started, and off once stopped, before it may switch again."
  - id: reserve-headroom
    term: Headroom (for reserves)
    def: "The output a running unit could still add, or the load it could still shed, which it can offer to the grid as a reserve."
  - id: discounted-cash-flow
    term: Discounted cash flow
    def: "Valuing a project's future yearly cash flows in today's money, each discounted at a chosen rate; their sum is the project's net present value."
  - id: renewable-penetration
    term: Renewable penetration
    def: "The share of a grid's electricity that comes from wind, solar and other renewable sources."
  - id: annualized-capital-cost
    term: Annualized capital cost
    def: "A building cost spread into equal yearly amounts over the equipment's life, with interest, so it can be set against a year's revenue."
  - id: capacity-bound
    term: Capacity bound
    def: "The largest size a model is allowed to choose for a piece of equipment."
  - id: baseload
    term: Baseload operation
    def: "Running a plant at steady full output around the clock, whatever the hour's price."
  - id: capacity-payment
    term: Capacity payment
    def: "Money a plant earns for being available to run when needed, as in a capacity market, apart from the energy it sells."
