# Sidecar of research studio R6 (builder learn-w4-f, W4, 2026-11-05): new glossary terms and requests for shared files.
lesson: r06-uncertainty-properly
glossary:
  - {id: structural-uncertainty, term: "Structural uncertainty", def: "Doubt about how a model is built (its equations, time steps and what it leaves out), which sampling its inputs cannot reveal; compare model forms instead."}
  - {id: deep-uncertainty, term: "Deep uncertainty", def: "A situation where the people involved do not know, or cannot agree on, the possible outcomes, their odds or the right model."}
  - {id: value-of-information, term: "Value of information", def: "How much a decision-maker would gain, on average, by learning an uncertain quantity before deciding; its upper limit is the value of a perfect forecast."}
