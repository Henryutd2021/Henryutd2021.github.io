# Sidecar for F4 (f04-power-plants), builder learn-w3-a (fork f04), 2026-11-03. Read by scripts/build_learn.py.
id: f04-power-plants
lesson: F4
glossary:
  - id: turbine
    term: Turbine
    def: "A machine whose blades are pushed round by moving gas, steam, water or wind, turning a shaft."
  - id: generator
    term: Generator
    def: "A machine that turns the spin of a shaft into electricity, by turning magnets past coils of wire."
  - id: heat-engine
    term: Heat engine
    def: "A machine that turns part of a flow of heat into motion, such as a steam or gas turbine; the hotter its heat source, the larger the part it can turn."
  - id: waste-heat
    term: Waste heat
    def: "Heat a power plant cannot turn into electricity and releases to the air or to cooling water."
  - id: gas-turbine
    term: Gas turbine
    def: "An engine that compresses air, burns fuel in it and lets the hot gas spin a turbine, as a jet engine does; alone it is a simple-cycle plant, such as a peaker."
  - id: steam-turbine
    term: Steam turbine
    def: "A turbine spun by high-pressure steam from a boiler or another heat source."
  - id: condenser
    term: Condenser
    def: "The part of a steam plant that cools the used steam back into water, so it can be pumped back to the boiler; most of the plant's waste heat leaves here."
  - id: hydraulic-head
    term: Head (hydropower)
    def: "The height the water falls through a hydro plant, from the reservoir's surface down to where it leaves the turbine, in metres."
  - id: reservoir
    term: Reservoir
    def: "The lake a dam holds back; its water is energy stored for later, up to what it holds."
  - id: penstock
    term: Penstock
    def: "The large pipe that carries water down from a reservoir to a hydro plant's turbine."
  - id: geothermal
    term: Geothermal power
    def: "Electricity made from the earth's heat, using hot water or steam brought up from wells."
  - id: run-of-river
    term: Run-of-river plant
    def: "A hydro plant with little or no reservoir, so it makes what the river's flow brings at the time."
  - id: start-up-time
    term: Start-up time
    def: "How long a plant takes to go from shut down to full output; the ramp rate is how fast it changes output once running."
  - id: carnot-limit
    term: Carnot limit
    def: "The largest share of heat any heat engine can turn into work: 1 minus the cold temperature over the hot temperature, both in kelvin."
  - id: hrsg
    term: Heat recovery steam generator (HRSG)
    def: "The boiler of a combined-cycle plant, heated by the gas turbine's hot exhaust instead of a flame."
  - id: nacelle
    term: Nacelle
    def: "The equipment housing on top of a wind turbine's tower, holding the gearbox and generator that the rotor turns."
