# Sidecar for Analyst lesson A5 (a05-adequacy). Read by the course build step.
id: a05-adequacy
lesson: A5
glossary:
  - id: capacity-accreditation
    term: Capacity accreditation
    def: "The share of a resource's MW that a grid counts toward its adequacy target, judged by how much the resource lowers the risk of a shortfall."
  - id: equivalent-firm-capacity
    term: Equivalent firm capacity
    def: "The MW of a perfect, always-available plant that would make a grid as reliable as a given resource does; divided by the resource's MW, it is an accreditation."
  - id: forced-outage-rate
    term: Forced outage rate
    def: "The share of time a power plant is unexpectedly out of service, waiting for repair, rather than out for planned maintenance."
  - id: lolh
    term: Loss-of-load hours (LOLH)
    def: "The expected number of hours a year in which supply falls short of demand, averaged over many simulated years."
  - id: resampled-weather
    term: Resampled weather year
    def: "A simulated year stitched together from pieces of real years, such as whole weeks, so that demand, wind and sun stay consistent within each piece; it is not an observed year."
