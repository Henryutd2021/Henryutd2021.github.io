id: a02-contracts-risk
lesson: A2
glossary:
  - id: power-purchase-agreement
    term: Power purchase agreement (PPA)
    def: "A long contract between a power plant's seller and a buyer that sets the price paid for the plant's power, or for its market value."
  - id: trading-hub
    term: Trading hub
    def: "A pricing point where many contracts are settled, priced as an average over many nodes of the grid."
  - id: basis-risk
    term: Basis risk
    def: "The risk that the price where a plant sells differs from the price at which its contract settles, such as its node against a trading hub."
  - id: capture-ratio
    term: Capture ratio
    def: "The average price over the hours a plant produces, as a share of the average price over all hours."
  - id: tolling-agreement
    term: Tolling agreement
    def: "A contract in which the buyer pays the owner of a plant a fixed fee for the right to run it, and keeps what it earns."
