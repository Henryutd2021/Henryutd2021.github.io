# Sidecar for Analyst lesson A2 (a02-contracts-risk). Read by the course build step.
id: a02-contracts-risk
lesson: A2
glossary:
  - id: power-purchase-agreement
    term: Power purchase agreement (PPA)
    def: "A long contract between a power plant's seller and a buyer that sets the price paid for the plant's power, or for its market value."
  - id: trading-hub
    term: Trading hub
    def: "A pricing point where many contracts are settled, priced as an average over many nodes of the grid."
  - id: basis-risk
    term: Basis risk
    def: "The risk that the price where a plant sells differs from the price at which its contract settles, such as its node against a trading hub."
  - id: capture-ratio
    term: Capture ratio
    def: "A market price averaged over the hours a plant produces, weighted by its output, divided by the same price's all-hours average, so hours with more output count more; measured at a hub, the plant's own price also differs by the basis."
  - id: pricing-node
    term: Pricing node
    def: "A point on the grid, such as a power plant's connection, where the market sets its own price."
  - id: battery-margin
    term: Battery margin
    def: "What a battery earns per megawatt-hour it discharges, after paying for the power it charged and the energy lost on the way."
  - id: tolling-agreement
    term: Tolling agreement
    def: "A contract in which the buyer pays the owner of a plant a fixed fee for the right to run it, and keeps what it earns."
