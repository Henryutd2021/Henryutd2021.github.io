# Sidecar for M4 (m04-storage-multienergy). Read by the course build step.
id: m04-storage-multienergy
lesson: M4
glossary:
  - id: reservoir-limit
    term: Reservoir limit
    def: "The lowest and highest level a store may hold, such as a tank's minimum pressure or a reservoir's lowest water level; a model writes it as bounds on the level."
  - id: sector-coupling
    term: Sector coupling
    def: "Linking energy carriers such as electricity, hydrogen and heat through devices that convert one into another, so that one carrier's supply and price affect the others."
  - id: value-of-coupling
    term: Value of coupling
    def: "How much cheaper a system is with devices that link its carriers than with each carrier supplied on its own, judged as a difference of optimal costs."
