id: a08-storage-duration
lesson: A8
glossary:
  - id: standing-loss
    term: Standing loss
    def: "Energy a store loses while it waits, used or not, such as heat leaking from a hot tank; it grows with time, unlike the loss of each charge and discharge."
  - id: long-duration-storage
    term: Long-duration storage
    def: "Storage that can give its full power for about 10 hours or more; DOE splits it into inter-day (10 to 36 hours) and multi-day or week-long (36 to 160 hours) stores."
  - id: full-cycle
    term: Full cycle
    def: "Charging a store's usable energy once and discharging it once; two half charges and discharges count as one full cycle."
