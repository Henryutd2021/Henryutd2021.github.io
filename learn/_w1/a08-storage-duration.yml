# Sidecar for A8 (a08-storage-duration). Read by the course build step.
id: a08-storage-duration
lesson: A8
glossary:
  - id: standing-loss
    term: Standing loss
    def: "Energy a store loses while it waits, used or not, such as heat leaking from a hot tank; it grows with time, unlike the loss of each charge and discharge."
  - id: long-duration-storage
    term: Long-duration storage
    def: "Storage for extended discharge, including the Department of Energy's 2023 inter-day (10–36 hours) and multi-day or week-long (36–160 hours) categories, though definitions vary."
    source-title: "Department of Energy, Long Duration Energy Storage Opportunities (July 27, 2023), slide 13"
    source: "https://www.energy.gov/sites/default/files/2023-08/Pathways%20to%20Commercial%20Liftoff%20Long%20Duration%20Energy%20Storage%20Opportunities.pdf#page=13"
  - id: full-cycle
    term: Full cycle
    def: "Charging a store's usable energy once and discharging it once; two half charges and discharges count as one full cycle."
requests:
  - "Engine E0 (SB0): A8's week LP is lesson-local in assets/learn/a08-storage-duration.js with a small interface (prepare(D, year, targets, profile) -> W; build(W, store, opts) -> LP; read(W, store, r) -> unserved, covered, schedule). When E0 exists, switch A8 to it: the page reads only build/read, and the test (_tests/learn/test_a08-storage-duration.js) re-solves every number, so a switch is checked."
