id: m01-dispatch-to-lmp
lesson: M1
glossary:
  - id: bus
    term: Bus
    def: "A point of the network where plants, loads and lines meet, such as a substation; a network model has one balance rule per bus."
  - id: dc-power-flow
    term: DC power flow
    def: "A linear approximation of how power splits over the lines of a network, which ignores losses and voltage and sets each line's flow from voltage angles and the line's reactance."
  - id: reactance
    term: Reactance
    def: "A line's opposition to alternating current; when several paths join two places, each carries a share of the power that falls as its reactance rises."
  - id: locational-marginal-price
    term: Locational marginal price (LMP)
    def: "The cost of serving one more megawatt-hour at one place on the grid in one interval, given the plants running and the limits of the lines."
  - id: congestion-rent
    term: Congestion rent
    def: "What loads pay at their locational prices minus what generators are paid at theirs, equal to each full line's shadow price times its flow."
