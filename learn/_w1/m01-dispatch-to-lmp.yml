id: m01-dispatch-to-lmp
lesson: M1
glossary:
  - id: bus
    term: Bus
    def: "A point of the network where plants, loads and lines meet, such as a substation; a network model has one balance rule per bus."
  - id: dc-power-flow
    term: DC power flow
    def: "A linear approximation of real-power flows that sets each line's flow from the voltage-angle difference across it, holds voltage magnitudes fixed, assumes small angles, and leaves out losses and reactive power."
  - id: reactance
    term: Reactance
    def: "A line's opposition to alternating current; when several paths join two places, each carries a share of the power that falls as its reactance rises."
  - id: locational-marginal-price
    term: Locational marginal price (LMP)
    def: "The extra cost per megawatt-hour of serving a small increase in demand at one place on the grid in one interval, given the plants running and the limits of the lines."
  - id: congestion-rent
    term: Congestion rent
    def: "What loads pay at their locational prices minus what generators are paid at theirs; in a DC model it equals the sum, over the full lines, of each line's shadow price times its flow."
