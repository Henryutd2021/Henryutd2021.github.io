# Sidecar for Analyst lesson A3 (a03-market-design), builder learn-w4-b, 2026-11-05. Read by scripts/build_learn.py.
id: a03-market-design
lesson: A3
glossary:
  - id: capture-price
    term: Capture price
    def: "The average market price a plant's output earns, each hour weighted by what the plant produced in it."
  - id: energy-only-market
    term: Energy-only market
    def: "A wholesale market design with no separate capacity market, in which energy and reserve prices, high in scarce hours, must pay for capacity that is rarely used."
  - id: capacity-market
    term: Capacity market
    def: "An auction, run ahead of time, that pays plants and other resources for being available, in an amount a planner sets, on top of energy prices."
  - id: missing-money
    term: Missing money
    def: "The gap between what a plant the grid needs earns from energy and reserves and what it costs to build or keep."
  - id: offer-cap
    term: Offer cap
    def: "The highest price a market's rules let a seller put in an offer; clearing prices can still rise above it, for example through scarcity pricing or congestion."
  - id: rto
    term: Regional transmission organization (RTO)
    def: "An independent organization, such as PJM or MISO, that runs a region's transmission grid and its wholesale electricity markets."
requests:
  - "Neutral by design: no market design is called best; the explain layer's Steelman gives the strongest case for each."
