lesson: M11
glossary:
  - id: energy-attribute-certificate
    term: Energy attribute certificate (EAC)
    def: "A tradable record that one megawatt-hour was generated by a given plant at a given place and time, which a buyer retires to claim that power; a rule decides which certificates may count."
  - id: incremental-analysis
    term: Incremental analysis
    def: "Judging an addition by the difference between the system with it and the system without it, so that costs and earnings that exist either way drop out."
  - id: placed-in-service
    term: Placed in service
    def: "The date a facility is ready and available to do its job; many tax credits start their clock on it."
  - id: capacity-utilization
    term: Capacity utilization
    def: "The energy a machine used or made over a year divided by its size times 8,760 hours, its average loading, so half power all year gives 50%, as full power for half the year does."
  - id: prevailing-wage-apprenticeship
    term: Prevailing wage and apprenticeship requirements
    def: "Two federal conditions of many clean-energy tax credits, the hydrogen credit among them, that raise the credit fivefold when both are met: those who build or repair the facility are paid at least the local prevailing wage, and apprentices from registered programs work a set number of hours."
