glossary:
  - id: energy-attribute-certificate
    term: Energy attribute certificate (EAC)
    def: "A tradable record that one megawatt-hour was generated by a given plant at a given place and time, which a buyer retires to claim that power; a rule decides which certificates may count."
  - id: incremental-analysis
    term: Incremental analysis
    def: "Judging an addition by the difference between the system with it and the system without it, so that costs and earnings that exist either way drop out."
  - id: placed-in-service
    term: Placed in service
    def: "The date a facility is ready and available to do its job; many tax credits start their clock on it."
