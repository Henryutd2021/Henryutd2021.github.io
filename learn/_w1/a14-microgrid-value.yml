# Sidecar for A14 (a14-microgrid-value), builder learn-w3-b, 2026-11-03. Read by scripts/build_learn.py.
id: a14-microgrid-value
lesson: A14
glossary:
  - id: value-of-lost-load
    term: Value of lost load
    def: "What a customer loses when power is cut, per hour or per kWh not delivered; it differs by customer and by how long the outage lasts."
  - id: productive-use
    term: Productive use
    def: "Electricity used to earn a living, such as running a grain mill, a water pump or a cold store, rather than only for lights and phones at home."
  - id: mini-grid
    term: Mini-grid
    def: "A small local grid, with its own sources, storage and wires, that serves a village or a town that the main grid does not reach."
