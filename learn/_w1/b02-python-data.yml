# Sidecar of lesson B2 (builder e, W1, 2026-11-02): new glossary terms and requests for shared files.
lesson: b02-python-data
glossary:
  - {id: utc, term: "Coordinated Universal Time (UTC)", def: "The world reference clock, with no daylight saving; EIA stamps its hourly grid data in it."}
  - {id: hour-ending, term: "Hour ending", def: "A time stamp that labels each hour by its last moment, so 01:00 means the hour from midnight to 01:00."}
  - {id: daylight-saving-time, term: "Daylight saving time", def: "Clocks moved an hour ahead in summer, giving one 23-hour day in spring and one 25-hour day in autumn."}
  - {id: telemetry, term: "Telemetry", def: "Measurements sent automatically from plants and substations to the grid operator."}
  - {id: frozen-telemetry, term: "Frozen telemetry", def: "A measurement feed stuck on its last value, which shows up as the same reading hour after hour."}
  - {id: resample, term: "Resample", def: "Regroup a time series to a coarser step, such as hours to days, by averaging or summing."}
  - {id: duration-curve, term: "Duration curve", def: "A year of hourly values sorted from highest to lowest, showing for how many hours each level is reached."}
  - {id: assert, term: "Assert", def: "A line of code that stops a program with a message when a stated condition is false."}
  - {id: dataframe, term: "DataFrame", def: "A pandas table with named columns and an index, such as one row per hour."}
