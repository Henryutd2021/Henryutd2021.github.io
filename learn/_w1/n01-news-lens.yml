# Sidecar of lesson N1: new glossary terms and requests for shared files.
lesson: n01-news-lens
glossary:
  - {id: counterfactual, term: "Counterfactual", def: "What would have happened without the change being judged; every saving or effect is measured against one."}
  - {id: system-boundary, term: "System boundary", def: "The line that decides which parts, costs and emissions a study counts and which it leaves out."}
  - {id: projection, term: "Projection", def: "A model's estimate of a future quantity under stated assumptions, not a measurement or a promise."}
  - {id: evidence-ladder, term: "Evidence ladder", def: "The stages a project climbs: announced, funded, permitted, under construction, operating and at design output."}
  - {id: gigawatt, term: "Gigawatt (GW)", def: "A thousand megawatts, a rate of energy flow used for large plants, whole fleets and national demand."}
  - {id: battery-duration, term: "Battery duration", def: "How many hours a battery can discharge at its rated power: its energy in MWh divided by its power in MW."}
  - {id: voltage, term: "Voltage", def: "The electrical push that drives current through a wire, measured in volts (V); 1 kilovolt (kV) is 1,000 V."}
  - {id: reactive-power, term: "Reactive power", def: "The part of alternating-current power that flows back and forth and does no net work; supplying or absorbing it locally helps keep voltage within safe limits."}
requests:
  - "Field Notes link: the scope scan flags ../field-notes/briefings.html as an internal link outside learn/, so the page names Field Notes in plain text only. A link would need field-notes/ on the scan's internal allow-list."
  - "No-JS fallback of learn/n01-news-lens.qmd, both generated from assets/learn/data/n01-news-lens.json and checked by the test: the stories and notes (fallback markers) by the lesson's fallback build step; the worked checks, spotter answers and ladder placements (fallback-checks markers) by node _tests/learn/test_n01-news-lens.js --write. Run both after a data edit."
