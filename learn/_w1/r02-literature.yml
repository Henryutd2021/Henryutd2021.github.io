# Sidecar of research studio R2: new glossary terms and requests for shared files.
lesson: r02-literature
glossary:
  - {id: snowballing, term: "Snowballing", def: "Finding papers from one you already have: backward through its references, forward through the works that cite it."}
  - {id: concept-matrix, term: "Concept matrix", def: "A table with papers in rows and ideas in columns, coded by a stated rule, that shows what a literature covers and what it leaves out."}
  - {id: research-gap, term: "Research gap", def: "A question the literature has not answered, shown with a logged search and the closest prior work, not just asserted."}
  - {id: boolean-operators, term: "Boolean operators", def: "AND, OR and NOT, the words that join search terms: AND narrows a search, OR widens it, NOT leaves terms out."}
  - {id: clustering, term: "Clustering", def: "Grouping similar items, such as days with similar demand and weather, so that one representative can stand for each group."}
  - {id: time-series-aggregation, term: "Time-series aggregation", def: "Shrinking a long series, such as a year of hours, to a few representative periods that a model can solve quickly."}
  - {id: storage-link, term: "Storage link (between periods)", def: "In a model of representative periods, the energy stored at the end of one period carried into the next, so storage can move energy across days or seasons."}
  - {id: extreme-period, term: "Extreme period", def: "An unusually demanding stretch of time, such as a cold, still week with high demand and little wind, kept in a model so its plan copes with it."}
  - {id: reanalysis, term: "Reanalysis", def: "A gridded record of past weather made by running a weather model over historical observations, hour by hour for decades."}
  - {id: self-organizing-map, term: "Self-organizing map", def: "A clustering method that places similar items, such as days, in neighboring cells of a small grid."}
requests:
  - "Data: assets/learn/data/r02-literature-openalex.json is written by the studio's snapshot build step. It queries OpenAlex once (about ten requests) and stores a dated snapshot; the page makes no live API call."
