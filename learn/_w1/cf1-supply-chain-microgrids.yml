id: cf1-supply-chain-microgrids
lesson: CF1
glossary:
  - id: transactive-energy
    term: Transactive energy
    def: "Buying and selling electricity with the grid at prices that change over time, so a site that makes power can also earn from it."
  - id: time-of-use
    term: Time-of-use tariff
    def: "A retail electricity price that changes with the hour of the day, higher at peak times and lower off-peak."
  - id: chance-constraint
    term: Chance constraint
    def: "A rule that must hold with a set probability, such as meeting store demand in 95 of every 100 weeks, rather than in every one."
