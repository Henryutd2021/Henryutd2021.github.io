# Sidecar for CF1 (cf1-supply-chain-microgrids). Read by the course build step.
# The page's excerpts are approved wording (E8, without E8.11-E8.12).
id: cf1-supply-chain-microgrids
lesson: CF1
glossary:
  - id: transactive-energy
    term: Transactive energy
    def: "Buying and selling electricity among many small participants, such as homes and firms with their own generation, as well as with the grid."
  - {id: time-of-use, alias: time-of-use-tariff}
  - id: chance-constraint
    term: Chance constraint
    def: "A rule required to hold with a chosen probability, for example at least a 95% chance of meeting a week's demand, rather than with certainty."
  - id: deterministic-equivalent
    term: Deterministic equivalent
    def: "A chance constraint rewritten as an ordinary rule with a safety margin, for example planning for the demand level that is exceeded with only the allowed probability."
  - id: stylized-network
    term: Stylized network
    def: "A simplified, made-up network built to show how a model behaves, with invented distances and costs rather than a real company's map."
  - id: synthetic-data
    term: Synthetic data
    def: "Invented values made to look realistic, used in place of real records so that a model can be shown and shared."
  - id: supply-chain-tier
    term: Supply-chain tier
    def: "One level of a supply chain, such as factories, then warehouses, then stores: a three-tier chain has all three, a two-tier chain two of them."
  - id: logistics-cost
    term: Logistics cost
    def: "The cost of moving and storing goods between factories, warehouses and stores: shipping, warehousing and handling."
requests:
