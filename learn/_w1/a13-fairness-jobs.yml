# Sidecar for A13 (a13-fairness-jobs). Read by the course build step.
id: a13-fairness-jobs
lesson: A13
glossary:
  - id: area-median-income
    term: Area median income (AMI)
    def: "The middle family income of an area, used to sort households into income bands such as 0-30% or 50-80% of it."
  - id: employment-multiplier
    term: Employment multiplier
    def: "The total jobs, on site plus at suppliers and from workers' spending, that go with each on-site job, taken from a regional input-output table."
  - id: gross-jobs
    term: Gross jobs
    def: "The jobs a project creates, counted on their own, without subtracting jobs lost or work that would have happened anyway."
  - id: net-jobs
    term: Net jobs
    def: "Jobs created minus jobs lost and minus work that would have existed anyway, so the change a project really makes."
  - id: tax-base
    term: Tax base
    def: "The total value a local government can tax, such as the assessed value of homes, businesses and power plants in a county."
  - id: screening-estimate
    term: Screening estimate
    def: "A quick estimate from stated assumptions and coefficients a reader can change, used to compare options, not to predict outcomes."
  - id: income-based-charge
    term: Income-based charge
    def: "A utility charge that varies with household income, such as a fixed charge set in a few income tiers."
requests:
