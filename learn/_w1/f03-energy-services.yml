# Sidecar for F3 (f03-energy-services). Read by the course build step.
id: f03-energy-services
lesson: F3
glossary:
  - id: energy-service
    term: Energy service
    def: "What people actually want from energy, such as a warm room, hot water, cold food, light or a trip; the energy is only the means."
  - id: energy-carrier
    term: Energy carrier
    def: "A form in which energy is moved to where it is used, such as electricity, natural gas, gasoline or hydrogen."
  - id: final-energy
    term: Final energy
    def: "The energy a home, business or vehicle buys and uses, as on its meters and receipts, such as kWh of electricity or gallons of gasoline."
  - id: useful-energy
    term: Useful energy
    def: "Energy a device delivers in the wanted form, such as heat, light or motion; a heat pump's delivered heat includes heat drawn from the outdoor air, not only the energy bought."
  - id: primary-energy
    term: Primary energy
    def: "Energy as found in nature before any conversion, such as the gas burned in a power plant to make the electricity a home later buys."
  - id: coefficient-of-performance
    term: Coefficient of performance (COP)
    def: "Heat a heat pump delivers divided by the electricity it uses; a COP of 3 means 3 kWh of heat for each kWh of electricity."
  - id: afue
    term: AFUE (annual fuel utilization efficiency)
    def: "The share of a furnace's fuel energy that leaves the furnace as heat over a heating season, under a standard test that leaves out duct losses and the fan's electricity."
  - id: heat-pump-cut-out
    term: Cut-out temperature (heat pump)
    def: "The outdoor temperature below which a heat pump's compressor, the pump that moves its heat, switches off, so a backup heater must take over."
