    term: Vintage
    def: "The year a plant was built: in a multi-decade model each vintage keeps its own cost and runs until its life ends."
  - id: time-slice
    term: Time slice
    def: "A group of hours, such as winter nights, that a planning model treats as one, weighted by how many hours it stands for."
