id: 04-forecasts
lesson: 4
glossary:
  - id: day-ahead-forecast
    term: Day-ahead forecast
    def: "A grid operator's estimate, made the day before, of how much power customers will use in each hour."
  - id: persistence-forecast
    term: Persistence forecast
    def: "The simplest forecast: the next value will be the same as the last one seen, or as the same hour a day or a week before."
  - id: mae
    term: Mean absolute error (MAE)
    def: "The average size of a forecast's misses, in the units of what is forecast, ignoring whether they were too high or too low."
  - id: mape
    term: Mean absolute percentage error (MAPE)
    def: "The average miss as a percentage of the actual value; it breaks down when actual values are near zero."
  - id: forecast-bias
    term: Bias
    def: "The average signed miss of a forecast, showing whether it tends to run too high or too low."
  - id: skill-score
    term: Skill score
    def: "How much smaller a forecast's error is than that of a simple baseline such as persistence."
  - id: prediction-interval
    term: Prediction interval
    def: "A range that should contain the actual value with a stated probability, drawn as a band around a forecast."
