# Sidecar of research studio R10 (r10-question-studio).
# Provenance and scope notes of assets/learn/data/r10-question-studio.json: written by hand from the course plan's
# question studio (pickers, checks, literature, crowding counts, blocked combinations, example cards) and its question
# types; rubric from the course rubric (assets/learn/components/rubric.js). Every element, lever, stakeholder and twist
# is from the course plan's lists; no combination of them leads outside the course's scope, and data centers appear
# only as a load. None of the example cards' extras (community solar, elderly households, water use and summer peak,
# heating demand) or card fields names nuclear technology. The test checks every draft the pickers can produce.
lesson: R10
glossary:
  - {id: search-string, term: "Search string", def: "The words and operators (AND, OR, quotation marks) typed into a literature database to find papers."}
  - {id: gis, term: "GIS (geographic information system)", def: "Software and methods for mapping and analyzing data tied to places, such as land use, lines and population."}
  - {id: econometrics, term: "Econometrics", def: "Statistics applied to economic data, often to estimate whether a change caused an effect."}
  - {id: mcda, term: "MCDA (multi-criteria decision analysis)", def: "Scoring options against several goals at once, such as cost, emissions and fairness, with weights that the people deciding set."}
  - {id: decision-analysis, term: "Decision analysis", def: "A structured way to choose among options under uncertainty, weighing each possible outcome by how likely and how valuable it is."}
  - {id: net-present-value, term: "Net present value", def: "The present value of a project's future income minus the present value of its costs; above zero, it earns more than it costs at the chosen discount rate."}
  - {id: techno-economic-analysis, term: "Techno-economic analysis (TEA)", def: "Estimating what a technology costs and earns from its engineering design, its prices and its operating pattern."}
  - {id: life-cycle-assessment, term: "Life cycle assessment (LCA)", def: "Counting a product's environmental effects, such as CO₂ emissions or water use, over its whole life, from materials to disposal."}
  - {id: customer-hours, term: "Customer-hours", def: "Customers without power times the hours they are out: 100 customers out for 3 hours is 300 customer-hours."}
  - {id: relative-growth-index, term: "Relative growth index (RGI)", def: "How fast a topic's paper count grew from 2016–18 to 2022–24, divided by the growth of energy-systems research as a whole."}
requests:
  - "OpenAlex search links: https://openalex.org/works?search=<string> (checked in a browser on 3 November 2026; Boolean AND/OR and quotes work). No API call is made from the page."
  - "Scope: the pickers are exactly the course plan's lists; no element, lever, stakeholder or twist names nuclear technology, and data centers enter every draft as 'data-center loads'. _tests/learn/test_r10-question-studio.js checks that no data string names nuclear technology (so the nuclear-plus-risk rule cannot be met), and runs every slot value in all five types plus a seeded sample of 200,000 full combinations through the scope scan's deny-list; when the course plan is available (LEARN_SOURCES) it also compares the picker lists, the 29 crowding counts and the seven example cards with it."
  - "The QuestionCard's share link (#q-...) opens R10 on the card step."
