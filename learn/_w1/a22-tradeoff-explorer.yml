# Sidecar for A22 (a22-tradeoff-explorer), builder learn-w2-b, 2026-11-03. Read by scripts/build_learn.py.
id: a22-tradeoff-explorer
lesson: A22
glossary:
  - id: reserve-margin
    term: Reserve margin
    def: "The capacity counted as available at the peak, above the year's peak demand, as a percentage of that peak."
  - id: fixed-charge
    term: Fixed charge
    def: "A part of a power bill that is the same each month however much electricity the home uses."
  - id: energy-burden
    term: Energy burden
    def: "The share of a household's income spent on energy bills."
  - id: energy-security
    term: Energy security
    def: "Keeping energy flowing at bearable prices when a fuel, a supplier or a route is cut off."
  - id: supply-diversity
    term: Supply diversity
    def: "How evenly the energy supply is spread over different sources, so that losing one does not lose most of it."
  - id: multi-objective
    term: Multi-objective problem
    def: "A choice with several goals that cannot all be at their best at once."
  - id: tariff
    term: Tariff
    def: "The rule for calculating electricity bills: fixed charges, prices per kWh, or both."
