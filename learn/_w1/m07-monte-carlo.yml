lesson: M7
glossary:
  - id: scenario
    term: Scenario
    def: "A coherent what-if set of a model's inputs, such as a 36-month wait; a scenario may be given a probability, though this lesson gives none."
  - id: probability-distribution
    term: Probability distribution
    def: "A rule that says how likely each value of an uncertain input is; a uniform distribution makes every value in its range equally likely."
  - id: rank-correlation
    term: Rank correlation (Spearman's ρ)
    def: "The correlation of the ranks of two quantities, from −1 to 1: how consistently one rises or falls with the other, whatever the shape of the link."
  - id: global-sensitivity-analysis
    term: Global sensitivity analysis
    def: "Ranking a model's inputs by their influence on a result while all of them vary together across their assumed ranges, rather than one at a time."
  - id: monte-carlo-error
    term: Monte Carlo error
    def: "How far an estimate from a Monte Carlo study would move with another random seed; it shrinks roughly with the square root of the number of runs."
