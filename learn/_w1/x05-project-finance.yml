id: x05-project-finance
lesson: X5
glossary:
  - id: capital-stack
    term: Capital stack
    def: "The layers of money that pay for a project, such as senior debt, tax equity and the sponsor's equity, each with its own place in the order of payment."
  - id: cash-flow-available-for-debt-service
    term: Cash flow available for debt service (CFADS)
    def: "A project's revenue minus its operating costs in a period: the cash that can pay the loan."
  - id: debt-service-coverage-ratio
    term: Debt-service coverage ratio (DSCR)
    def: "The cash available for debt service divided by the loan payment due; a lender asks for a minimum, such as 1.30, as a cushion."
  - id: tax-equity
    term: Tax equity
    def: "Money from an investor with a large tax bill, put into a project in exchange for most of its tax credits and depreciation, plus some cash."
  - id: sponsor-equity
    term: Sponsor equity
    def: "The developer's or owner's own money in a project: paid last, so it carries the most risk and keeps what is left."
