# Sidecar of research studio R9: new glossary terms and requests for shared files.
lesson: r09-integrity-stakeholders
glossary:
  - {id: informed-consent, term: "Informed consent", def: "A person's agreement to take part in research, given freely after being told what will happen, the risks and how their data will be used."}
  - {id: ethics-board, term: "Ethics board (IRB)", def: "The committee that reviews research with people before it starts; in the United States, an institutional review board."}
  - {id: conflict-of-interest, term: "Conflict of interest", def: "A financial or other tie that could bias, or seem to bias, a researcher's work, and so must be declared."}
  - {id: stakeholder, term: "Stakeholder", def: "A person or group affected by a study or the decision it informs, or able to affect it."}
  - {id: credit-roles, term: "CRediT contributor roles", def: "A standard list of 14 names for what each author did, such as conceptualization (shaping the question), data curation (cleaning and documenting data) and formal analysis."}
  - {id: synthetic-sample, term: "Synthetic sample", def: "A few invented records with the same columns and realistic values as data that cannot be shared, so others can run the code without the real data."}
requests:
  - "Step text: the dilemma cards are built from one template ('Dilemma N of 6 · title. Read the case...'); the test checks it."
