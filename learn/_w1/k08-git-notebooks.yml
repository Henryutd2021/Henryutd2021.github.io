# Sidecar for toolbox K8 (k08-git-notebooks). Read by the course build step.
id: k08-git-notebooks
lesson: K8
glossary:
  - id: version-control
    term: Version control
    def: "Keeping every saved state of a project's files, with who changed what and why, so any earlier state can be compared or brought back."
  - id: repository
    term: Repository
    def: "A project folder together with its full history of commits, as kept by a version-control tool such as Git."
  - id: commit
    term: Commit
    def: "A recorded snapshot of a project's tracked files as they were staged, with a message, its author and time, and a link to the commit before it."
  - id: staging-area
    term: Staging area
    def: "Git's list of changes picked for the next commit: git add puts a file's current version there."
  - id: branch
    term: Branch
    def: "A movable label on a line of commits, so a what-if can grow without changing the main line of work."
  - id: diff
    term: Diff
    def: "A line-by-line list of what changed between two versions of a file, with removed lines marked minus and added lines plus."
  - id: merge
    term: Merge
    def: "Joining two lines of commits into one, keeping the changes made on both."
  - id: clone
    term: Clone
    def: "A complete new copy of a repository, with its files and its whole history."
  - id: notebook-kernel
    term: Notebook kernel
    def: "The running program behind a notebook that holds its variables in memory between cells, whatever order the cells were run in."
  - id: hidden-state
    term: Hidden state
    def: "Values in a notebook's memory that no longer match the code on the page, for example after a cell was edited but not rerun."
  - id: gitignore
    term: .gitignore
    def: "A file listing names and folders, such as keys and large raw data, that git add skips while they are untracked; it does not remove files already committed."
  - id: tracked-file
    term: Tracked file
    def: "A file Git already knows, because it is in the last commit or the staging area; a new file stays untracked until git add."
  - id: git-head
    term: HEAD (Git)
    def: "Git's name for the commit you are on now; usually it points at a branch label, which points at that commit."
  - id: notebook
    term: Notebook
    def: "A document of code cells and text, such as a Jupyter notebook: you run each cell on its own, and its output appears under it."
  - id: api-key
    term: API key
    def: "A private code that identifies you to an online data service; treat it like a password and keep it out of shared files."
  - id: checksum
    term: Checksum
    def: "A short fingerprint computed from a file's bytes, such as SHA-256, that changes if even one byte of the file changes."
  - id: random-seed
    term: Random seed
    def: "A fixed starting number for a random-number generator, so a random draw comes out the same on every run."
