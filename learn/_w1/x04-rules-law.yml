glossary:
  - id: rate-case
    term: Rate case
    def: "A formal proceeding in which a utility asks its regulator to change its rates; staff, consumer advocates and other parties file testimony, and the commission decides."
  - id: revenue-requirement
    term: Revenue requirement
    def: "The total a regulated utility may collect from its customers in a year: its allowed operating costs plus an allowed return on the net value of what it has built."
