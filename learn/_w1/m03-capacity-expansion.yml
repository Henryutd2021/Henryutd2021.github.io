id: m03-capacity-expansion
lesson: M3
glossary:
  - id: period-weight
    term: Period weight
    def: "How many hours of the year one modelled hour of a representative period stands for; a model multiplies that hour's running cost and emissions by it."
  - id: resource-adequacy
    term: Resource adequacy
    def: "Whether a power system has enough supply to meet demand in nearly every hour, judged with many weather years and plant outages against a criterion such as a loss-of-load expectation."
  - id: lole
    term: Loss-of-load expectation (LOLE)
    def: "The expected number of days a year on which supply falls short of demand at least once, of any size or length, averaged over many simulated years; an expectation, not a count of real outages."
  - id: medoid
    term: Medoid
    def: "The member of a group whose total distance to the other members is smallest; unlike an average, it is a real member."
