glossary:
  - id: parameter
    term: Parameter
    def: "A given number in a model, such as a demand or a price, which the solver uses but does not choose."
  - id: verification
    term: Verification
    def: "Checking that a model does what its equations say, with tests such as units, the energy balance and hand-solved cases."
  - id: validation
    term: Validation
    def: "Checking that a model represents the real system well enough for the question it is used to answer."
requests:
