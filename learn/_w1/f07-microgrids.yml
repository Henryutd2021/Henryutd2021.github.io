# Sidecar for F7 (f07-microgrids). Read by the course build step.
id: f07-microgrids
lesson: F7
glossary:
  - id: point-of-common-coupling
    term: Point of common coupling
    def: "The one place where a microgrid meets the main grid, with the switch that opens to let it run on its own."
  - id: grid-forming
    term: Grid-forming
    def: "Said of an inverter or a generator that sets voltage and frequency itself, so it can start and hold an island with no grid behind it."
  - id: grid-following
    term: Grid-following
    def: "Said of an inverter, such as an ordinary solar inverter, that follows a voltage something else sets and stops when there is none."
  - id: critical-load
    term: Critical load
    def: "The loads that must stay on in an outage, such as a hospital or a water plant; the rest can be switched off."
  - id: mini-grid
    term: Mini-grid
    def: "A small local grid, with its own sources, storage and wires, that serves a village or a town that the main grid does not reach."
  - id: techno-economic-optimization
    term: Techno-economic optimization
    def: "A model that compares equipment sizes and ways of running them by both their performance and their cost, and picks the best for a stated goal."
