id: f02-systems-and-map
lesson: F2
glossary:
  - id: stock
    term: Stock
    def: "An amount that builds up or drains over time, such as water in a reservoir, energy in a battery or CO₂ emitted so far."
  - id: flow
    term: Flow
    def: "A rate that fills or drains a stock, such as megawatts into a battery or tonnes of CO₂ a year; only flows change a stock."
  - id: feedback-loop
    term: Feedback loop
    def: "A chain of causes that leads back to where it started, so a change comes back to push on itself."
  - id: reinforcing-loop
    term: Reinforcing loop
    def: "A feedback loop with an even number of negative links, in which a change feeds itself, as growth or as decline."
  - id: balancing-loop
    term: Balancing loop
    def: "A feedback loop with an odd number of negative links, which tends to oppose the change that started it; with long delays it can overshoot or swing back and forth."
  - id: causal-loop-diagram
    term: Causal-loop diagram
    def: "A map of causes and effects in which every arrow carries a sign: plus if more of the cause brings more of the effect, minus if it brings less."
  - id: rebound-effect
    term: Rebound effect
    def: "Part of an efficiency saving taken back because the cheaper service gets used more."
  - id: carbon-budget
    term: Carbon budget
    def: "A cap on the total CO₂ emitted over many years, a limit on a stock rather than on one year's flow."
  - id: net-zero
    term: Net zero (CO₂)
    def: "The point at which the CO₂ a country or the world adds to the air each year is balanced by the CO₂ it removes, so that cumulative emissions stop rising."
  - id: scarcity-price
    term: Scarcity price
    def: "A very high wholesale price in hours when available supply barely covers demand."
