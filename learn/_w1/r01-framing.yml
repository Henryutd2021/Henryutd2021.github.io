# Sidecar of research studio R1 (r01-framing): new glossary terms and requests for shared files.
# Provenance of assets/learn/data/r01-framing.json: written by hand for the course's research studios (R1); question
# types and templates from the course's question types; rubric from the course rubric (assets/learn/components/rubric.js).
lesson: R1
glossary:
  - {id: question-type, term: "Question type", def: "The kind of answer a research question asks for: descriptive, explanatory, evaluative, predictive or prescriptive."}
  - {id: falsification-statement, term: "Falsification statement", def: "A sentence naming the result that would show your expected answer wrong."}
  - {id: energy-burden, term: "Energy burden", def: "The share of a household's income spent on energy bills."}
  - {id: co-op, term: "Co-op (electric cooperative)", def: "An electric utility owned by the members it serves, common in rural areas."}
  - {id: time-of-use-tariff, term: "Time-of-use tariff", def: "A retail electricity price that changes with the hour of the day, higher at peak times and lower off-peak.", lesson: A4}
  - {id: ex-post-review, term: "Ex-post review", def: "An evaluation made after a program or project has run, comparing what happened with what was planned or expected."}
  - {id: substation, term: "Substation", def: "A fenced yard of transformers, breakers and switches where the grid changes voltage and where feeders start."}
requests:
  - "Rubric competence picks are per studio (R1: framing). The rubric note on all three studios says a studio is practice, not a certificate."
