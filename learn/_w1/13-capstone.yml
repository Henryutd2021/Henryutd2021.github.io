glossary:
  - id: representative-period
    term: Representative period
    def: "A real stretch of time, such as a week, chosen to stand for many similar ones so that a model can run faster."
  - id: capacity-expansion
    term: Capacity expansion model
    def: "An optimization model that decides what to build, as well as how to run it, at least cost."
