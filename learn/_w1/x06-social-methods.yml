id: x06-social-methods
lesson: X6
glossary:
  - id: choice-experiment
    term: Choice experiment
    def: "A survey method in which people choose repeatedly between offers whose features vary, so that the weight of each feature can be estimated."
  - id: ethnography
    term: Ethnography
    def: "A research method of long observation and conversation with people where they live or work, to understand their routines in their own terms."
  - id: participatory-mapping
    term: Participatory mapping
    def: "A method in which residents mark on maps the places that matter to them, for planners to weigh."
