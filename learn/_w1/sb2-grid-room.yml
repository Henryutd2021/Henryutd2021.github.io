# scripts/build_learn.py.
id: sb2-grid-room
lesson: SB2
glossary:
  - id: transport-model
    term: Transport model
    def: "A network model in which each link can carry any flow up to its limit, with no power-flow physics: power goes where the cheapest routes allow."
  - id: forced-outage-rate
    term: Forced outage rate
    def: "The share of time a power plant is unexpectedly out of service, waiting for repair, rather than out for planned maintenance."
  - id: lolh
    term: Loss-of-load hours (LOLH)
    def: "The expected number of hours a year in which supply falls short of demand, averaged over many simulated years."
  - id: uprate
    term: Uprate (of a line or link)
    def: "Raising the most power a line or link may carry, for example with new conductors or a second circuit."
requests:
