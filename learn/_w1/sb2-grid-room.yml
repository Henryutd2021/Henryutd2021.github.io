id: sb2-grid-room
lesson: SB2
glossary:
  - id: transport-model
    term: Transport model
    def: "A network model in which each link can carry any flow up to its limit, with no power-flow physics: power goes where the cheapest routes allow."
  - id: forced-outage-rate
    term: Forced outage rate
    def: "The share of time a plant is unexpectedly out of service when it would be needed, such as 6% for a gas turbine."
  - id: lolh
    term: Loss-of-load hours (LOLH)
    def: "The expected number of hours a year in which supply falls short of demand, of any size."
