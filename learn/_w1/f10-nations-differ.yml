lesson: F10
glossary:
  - id: sankey-diagram
    term: Sankey diagram
    def: "A flow diagram in which each band's width is the amount of energy it carries, so what flows in and out of every box can be read and compared at a glance."
  - id: exajoule
    term: Exajoule (EJ)
    def: "A unit of energy equal to a thousand petajoules (10^18 joules, about 278 TWh), used for the yearly energy of a whole country."
  - id: physical-energy-content
    term: Physical energy content method
    def: "A rule for counting primary energy in which nuclear power counts as the heat its reactors make and hydro, wind and solar as the electricity they make; the IEA and Eurostat use it."
  - id: substitution-method
    term: Substitution method
    def: "A rule for counting primary energy in which each MWh from nuclear, hydro, wind and solar counts as the fuel a thermal power plant would burn to make it."
  - id: import-dependence
    term: Import dependence
    def: "A country's net energy imports as a share of the energy it uses (its primary energy supply; Eurostat divides by gross available energy), negative for a net exporter; its value depends on how primary energy is counted."
  - id: non-energy-use
    term: Non-energy use
    def: "Fuels used as raw materials rather than burned for energy, such as natural gas for fertilizer or oil for plastics and asphalt."
  - id: unbundling
    term: Unbundling
    def: "Separating the grid from the making and selling of electricity, so that different companies, or legally separate parts of one, run each."
  - id: bidding-zone
    term: Bidding zone (price zone)
    def: "An area of a power market in which every seller and buyer gets the same wholesale price for each trading period, as in Europe's markets."
  - id: market-coupling
    term: Market coupling
    def: "Joining neighbouring power markets so that one calculation sets their prices and the flows between them, sending power toward higher prices until the links are full."
  - id: flow-based-coupling
    term: Flow-based market coupling
    def: "A form of market coupling that limits trades by how much power would flow on each critical line of the grid, rather than by a fixed amount per border."
  - id: hvdc
    term: HVDC (high-voltage direct current)
    def: "A transmission link that carries power as direct current, used for long undersea cables and to join grids that do not run in step."
  - id: heating-degree-days
    term: Heating degree days
    def: "A measure of how cold a year was: for each day, the degrees by which its average temperature fell below a base such as 18 °C, added over the year."
