id: cf6-shifting-load-to-clean-hours
lesson: CF6
glossary:
  - id: average-emission-factor
    term: Average emission factor
    def: "An hour's CO₂ from all the plants that ran, divided by all the electricity used in that hour."
  - id: marginal-emission-factor
    term: Marginal emission factor
    def: "The change in a grid's CO₂ when demand in one hour grows by one megawatt-hour: the CO₂ rate of the plant that serves it."
