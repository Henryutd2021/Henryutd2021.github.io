id: cf6-shifting-load-to-clean-hours
lesson: CF6
glossary:
  - id: average-emission-factor
    term: Average emission factor
    def: "An hour's CO₂ from all the plants that ran, divided by all the electricity used in that hour."
  - id: marginal-emission-factor
    term: Marginal emission factor
    def: "The change in a grid's total CO₂ caused by a small change in electricity demand; in Prairie Town, the CO₂ rate of the next plant that responds."
  - id: attributed-emissions
    term: Attributed emissions
    def: "The share of a grid's CO₂ assigned to one user, for example each MWh it uses times that hour's average emission factor."
  - id: optimization-window
    term: Optimization window
    def: "The stretch of time, such as a month, within which a model may move electricity use between hours while keeping the total over that stretch."
  - id: penalty
    term: Penalty
    def: "An extra cost added to a model's objective for an action it should not take too freely, such as adjusting an hour's load."
