# Sidecar for CF2 (cf2-cost-per-kg-vs-system-cost). Read by the course build step. The page's excerpts are approved
# wording (E3-E5).
id: cf2-cost-per-kg-vs-system-cost
lesson: CF2
glossary:
  - id: electrolyzer
    term: Electrolyzer
    def: "A machine that uses electricity to split water into hydrogen and oxygen."
  - id: lcoh
    term: Levelized cost of hydrogen (LCOH)
    def: "The cost of making one kilogram of hydrogen over a plant's life: discounted lifetime costs divided by discounted lifetime kilograms (with the same cost and output every year, one year's annualized cost divided by one year's kilograms, as in CF2's toy)."
  - id: prognostics
    term: Prognostics
    def: "Predicting when a machine part is likely to fail, from data on its condition, so that repairs can be planned before it does."
  - id: fuel-cell
    term: Fuel cell
    def: "A device that turns hydrogen (and oxygen from the air) into electricity, with water as the by-product: an electrolyzer run backwards."
  - id: firm-output
    term: Firm output
    def: "Power a plant can be counted on to deliver steadily, such as the same output in every hour; also called stabilized output."
  - id: life-cycle-cost
    term: Life-cycle cost
    def: "Everything a system costs over its whole life, building, running, repairs and replacements, in today's money."
  - id: ercot
    term: ERCOT
    def: "The Electric Reliability Council of Texas: the grid operator, and its wholesale market, for most of Texas."
  - id: concentrated-solar
    term: Concentrated solar power
    def: "Mirrors focus sunlight to heat a fluid; the heat runs a turbine or a process, and it can be stored for hours in tanks."
  - id: thermal-storage
    term: Thermal storage
    def: "Storing energy as heat, for example in tanks of hot molten salt, to use it hours later."
  - id: high-temperature-electrolyzer
    term: High-temperature electrolyzer
    def: "An electrolyzer that splits steam at several hundred degrees Celsius; part of the energy comes as heat, so it needs less electricity per kilogram."
  - id: photovoltaic
    term: Photovoltaic (PV)
    def: "Solar panels that turn sunlight directly into electricity."
