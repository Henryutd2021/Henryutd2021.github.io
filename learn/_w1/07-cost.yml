# Lesson 7 (07-cost) sidecar, W1 builder d (2026-11-02): new glossary terms and requests for shared files.
lesson: 7
glossary:
  - id: capital-cost
    term: Capital cost
    def: "The money spent to build a power plant, usually given per kilowatt of capacity, before it makes any electricity."
  - id: fixed-om
    term: Fixed O&M
    def: "Operation and maintenance costs a plant pays every year whether or not it runs, such as staff and insurance."
  - id: variable-om
    term: Variable O&M
    def: "Operation and maintenance costs, apart from fuel, that grow with every megawatt-hour a plant makes."
  - id: discount-rate
    term: Discount rate
    def: "The yearly rate used to turn money paid or received in the future into its value today."
  - id: present-value
    term: Present value
    def: "What an amount of money paid or received in the future is worth today, once it is discounted."
  - id: wacc
    term: Weighted average cost of capital (WACC)
    def: "The blended return a project must pay its lenders and its owners, used as the project's discount rate."
  - id: capital-recovery-factor
    term: Capital recovery factor (CRF)
    def: "The share of a building cost that must be repaid each year, with interest, to pay it off over a given number of years."
  - id: tornado-chart
    term: Tornado chart
    def: "A chart that ranks inputs by how far a result moves when each input is swung from a low to a high value, one at a time."
  - id: heat-rate
    term: Heat rate
    def: "The fuel energy a power plant burns to make one megawatt-hour, for example in MMBtu per MWh, so lower means more efficient."
  - id: overnight-cost
    term: Overnight cost
    def: "The cost to build a power plant as if it were built overnight, so with no interest paid during construction, usually given per kilowatt."
  - id: mmbtu
    term: MMBtu
    def: "One million British thermal units, a unit of fuel heat; about 0.29 MWh of heat, and gas is priced in dollars per MMBtu."
