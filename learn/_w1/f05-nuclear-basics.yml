# Sidecar for F5 (f05-nuclear-basics), builder learn-w3-a (F5 fork), 2026-11-03. Read by scripts/build_learn.py.
id: f05-nuclear-basics
lesson: F5
glossary:
  - id: fission
    term: Fission
    def: "The splitting of a heavy atom, such as uranium-235, into two smaller atoms when it absorbs a neutron, which releases heat and a few new neutrons."
  - id: neutron
    term: Neutron
    def: "A particle with no electric charge in the nucleus of an atom; in a reactor, the neutrons from one fission go on to split more atoms."
  - id: chain-reaction
    term: Chain reaction
    def: "A run of fissions in which the neutrons from each split go on to split more atoms; a reactor holds it steady, with each generation as large as the last."
  - id: multiplication-factor
    term: Multiplication factor (k)
    def: "In a chain reaction, the number of new fissions each fission leads to on average: below 1 the chain dies out, at 1 it holds steady, above 1 it grows."
  - id: criticality
    term: Critical (of a reactor)
    def: "The steady state of a chain reaction, with a multiplication factor of exactly 1; it is a reactor's normal operating state, not an emergency."
  - id: moderator
    term: Moderator
    def: "A material, such as ordinary water or graphite, that slows the fast neutrons from fission so that uranium-235 captures them more easily."
  - id: control-rod
    term: Control rod
    def: "A rod of neutron-absorbing material that is pushed into a reactor core to slow the chain reaction, or pulled out to speed it up."
  - id: coolant
    term: Coolant
    def: "The fluid, such as water, helium, liquid sodium or molten salt, that carries heat away from a reactor core."
  - id: fuel-assembly
    term: Fuel assembly
    def: "A bundle of fuel rods, each a sealed metal tube of stacked uranium pellets, loaded into a reactor core as one unit."
  - id: enrichment
    term: Enrichment (of uranium)
    def: "Raising the share of uranium-235 in uranium: natural uranium has just over 0.7%, and power-plant fuel in the United States 3% to 5%."
  - id: steam-generator
    term: Steam generator
    def: "A heat exchanger in which hot water from a reactor's sealed loop boils the water of a second, separate loop into steam."
  - id: outlet-temperature
    term: Outlet temperature
    def: "The temperature of the coolant as it leaves a reactor core; it sets how hot the heat is that a plant can supply."
  - id: decay-heat
    term: Decay heat
    def: "Heat that the radioactive fission products in used fuel keep giving off after the chain reaction has stopped."
  - id: spent-fuel
    term: Spent fuel
    def: "Fuel that has been used in a reactor and taken out; it is solid, highly radioactive and still warm, and is kept first in water pools, later in dry casks."
  - id: passive-safety
    term: Passive safety
    def: "Safety features that rely on natural effects, such as hot fluid rising and cool fluid sinking, instead of pumps, outside power or operators."
  - id: mwt-mwe
    term: MWt and MWe
    def: "Megawatts of heat (thermal) and megawatts of electricity (electric); a plant's MWe is its MWt times its efficiency."
  - id: megapascal
    term: Megapascal (MPa)
    def: "A unit of pressure, one million pascals; the air pressure at sea level is about 0.1 MPa."
  - id: btu
    term: Btu (British thermal unit)
    def: "A unit of heat, the energy that warms one pound of water by one degree Fahrenheit; one kilowatt-hour equals 3,412 Btu."
  - id: heat-exchanger
    term: Heat exchanger
    def: "A device that passes heat from one fluid to another through a wall, without mixing them; heat flows only from the hotter fluid to the cooler one."
  - id: district-heating
    term: District heating
    def: "Heat made in one place and piped as hot water or steam to warm many buildings."
  - id: desalination
    term: Desalination
    def: "Removing salt from seawater or salty groundwater to make fresh water, with heat or with electricity."
