# Sidecar for SB3 (sb3-city-planner), M12 (m12-city-model) and C3 (c3-prairie-city-2040).
# Read by the course build step.
id: sb3-city-planner
lesson: SB3
glossary:
  - id: energy-hub
    term: Energy hub
    def: "A model of a place where energy carriers come in, are converted and stored, and meet the uses: a district, a campus or a city, not a building."
  - id: linearized-feeder-limit
    term: Linearized feeder limit
    def: "A ceiling on the power through a substation or feeder in each hour, written as a straight-line rule a linear program can use, with no voltage or power-flow physics."
  - id: managed-charging
    term: Managed charging
    def: "Charging electric cars in the hours a utility or an aggregator chooses, within limits the drivers set, instead of as soon as they plug in."
  - id: retrofit
    term: Retrofit
    def: "Work on an existing building, such as air sealing and insulation, that cuts the heat it needs."
  - id: tie-rule
    term: Tie rule
    def: "A stated way to pick one answer when several plans cost exactly the same, usually tiny costs that are left out of the reported results."
  - id: electric-vehicle
    term: Electric vehicle (EV)
    def: "A car, bus or truck driven by an electric motor from a battery charged from the grid, instead of by burning gasoline or diesel."
  - id: building-envelope
    term: Building envelope
    def: "A building's outer shell, its walls, roof, windows and floor, whose insulation and air sealing set how fast heat leaks out."
requests:
  - "Engine E3's data: assets/learn/data/e3-city-hub.json from engine E3's data build step; its precomputed block from the SB3, M12 and C3 tests' --write."
