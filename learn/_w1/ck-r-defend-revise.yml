# Sidecar for CK-R (ck-r-defend-revise), builder learn-w7-b, 2026-11-07. Read by scripts/build_learn.py.
id: ck-r-defend-revise
lesson: CK-R
requests:
  - "CK-R uses the shared runner unchanged: gateAll, the late-answer rule (late: practice), openFirst not-right, and its own level, describe and summary. The worked review, response and revision are LX.Exemplars inside the gated solution; a key other than weak or good ('prof') draws the neutral card, with its own lead word."
  - "The fictional co-op study (Prairie Valley Co-op, 112 irrigation pumps, a night-pumping tariff) is new in W7 and lives only in ck-r-defend-revise.json; its numbers are illustrative, not simulated."
  - "Fix after the Codex review (2026-11-07): task 1 first. CK-R's view swaps a marked task's question for a notice until task 1 is submitted, and keeps task 1's text read-only afterwards, on the runner's 'layout' event and its markup (.lx-ck-card, .lx-ck-q, .lx-ck-body, .lx-ck-sol). A shared option in checkpoint.js would be cleaner: opensAfter: {taskId: [ids]} (a task shown shut until its prerequisites are answered) and freeze: [ids] (a written task read-only once submitted)."
glossary:
  - term: Clean clone
    id: clean-clone
    lesson: K8
    def: "A fresh clone of a repository into a new, empty folder, run with only what the repository holds, so that no file left on your own machine can change the result."
  - term: Lock file
    id: lock-file
    lesson: K8
    def: "A file in a repository that pins the exact version of every package the code uses, so the same environment can be built again."
  - term: 95% confidence interval
    id: confidence-interval
    lesson: M14
    def: "A range worked out from the data by a method that, over many repeated samples, would contain the true value 95 times in 100."
