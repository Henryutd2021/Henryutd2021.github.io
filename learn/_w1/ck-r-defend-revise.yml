# Sidecar for CK-R (ck-r-defend-revise). Read by the course build step.
id: ck-r-defend-revise
lesson: CK-R
requests:
  - "CK-R uses the shared runner unchanged: gateAll, the late-answer rule (late: practice), openFirst not-right, and its own level, describe and summary. The worked review, response and revision are LX.Exemplars inside the gated solution; a key other than weak or good ('prof') draws the neutral card, with its own lead word."
  - "The fictional co-op study (Prairie Valley Co-op, 112 irrigation pumps, a night-pumping tariff) lives only in ck-r-defend-revise.json; its numbers are illustrative, not simulated."
glossary:
  - term: Software environment
    id: software-environment
    lesson: K8
    def: "The language, packages and versions a program runs with, built from a lock file so that a rerun uses the same ones."
  - term: Audit trail
    id: audit-trail
    lesson: R5
    def: "A record that lets someone follow a qualitative analysis from its raw material, such as interview notes, to each finding."
  - term: Matched comparison
    id: matched-comparison
    lesson: M14
    def: "A comparison that pairs each unit that got the change with one that did not but was similar before it."
  - term: Clean clone
    id: clean-clone
    lesson: K8
    def: "A fresh clone of a repository into a new, empty folder, run with only what the repository holds, so that no file left on your own machine can change the result."
  - term: Lock file
    id: lock-file
    lesson: K8
    def: "A file in a repository that pins the exact version of every package the code uses, so the same environment can be built again."
  - term: 95% confidence interval
    id: confidence-interval
    lesson: M14
    def: "A range worked out from the data by a method that, over many repeated samples, would contain the true value 95 times in 100."
