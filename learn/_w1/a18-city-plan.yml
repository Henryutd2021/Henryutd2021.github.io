# Sidecar for A18 (a18-city-plan), builder learn-w5-d, 2026-11-06. Read by scripts/build_learn.py.
id: a18-city-plan
lesson: A18
glossary:
  - id: scope-1
    term: Scope 1 emissions
    def: "Emissions from sources inside the boundary being counted: a company's own boilers and vehicles, or, for a city, fuels burned inside its border."
  - id: scope-3
    term: Scope 3 emissions
    def: "Other emissions that happen outside the boundary because of activities inside it, such as electricity lost on the wires that bring a city its power."
  - id: marginal-abatement-cost-curve
    term: Marginal abatement cost curve
    def: "A chart of measures that cut emissions, each a bar as wide as the tonnes it avoids and as high as its cost per tonne, sorted cheapest first."
  - id: abatement-cost
    term: Cost per tonne avoided
    def: "A measure's net yearly cost, its capital spread over its life plus upkeep minus the energy it saves, divided by the tonnes of CO2 it avoids a year."
  - id: design-day
    term: Design day
    def: "A cold (or hot) day chosen for planning, so that equipment and networks are sized for its highest hour rather than for an average day."
requests:
