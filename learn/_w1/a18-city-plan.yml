  - "Cross-page numbers: A18 reads the heat pump's cost ($8,620, 2022 dollars), rooftop solar's cost, life and upkeep and the 4% real rate from e0.json, and every Prairie City number from prairie-city.json. A15 (branch a) prices envelopes, heat pumps and lighting too: at integration, one source for shared measure costs (A18's are EIA AEO2026 RDM Table 2 and EIA's equipment report Appendix A, LBNL April 2015, ORNL/TM-2014/338)."
