# Sidecar for A18 (a18-city-plan). Read by the course build step.
id: a18-city-plan
lesson: A18
glossary:
  - id: scope-1
    term: Scope 1 emissions
    def: "Emissions from sources inside the boundary being counted: a company's own boilers and vehicles, or, for a city, fuels burned inside its border."
  - id: scope-3
    term: Scope 3 emissions
    def: "Other emissions that happen outside the boundary because of activities inside it, such as electricity lost on the wires that bring a city its power."
  - id: marginal-abatement-cost-curve
    term: Marginal abatement cost curve
    def: "A chart of measures that cut emissions, each a bar as wide as the tonnes it avoids and as high as its cost per tonne, sorted cheapest first."
  - id: abatement-cost
    term: Cost per tonne avoided
    def: "A measure's net yearly cost, its capital spread over its life plus upkeep minus the energy it saves, divided by the tonnes of CO2 it avoids a year."
  - id: design-day
    term: Design day
    def: "A cold (or hot) day chosen for planning, so that equipment and networks are sized for its highest hour rather than for an average day."
  - id: gpc
    term: GPC
    def: "The Global Protocol for Community-Scale Greenhouse Gas Emission Inventories (WRI, C40 Cities and ICLEI, 2014), the common standard for counting a city's emissions by sector and scope."
  - id: weatherization
    term: Weatherization
    def: "Air sealing, insulation and similar work on a building's shell that cuts the heat it loses, so it needs less heating."
  - id: condensing-furnace
    term: Condensing furnace
    def: "A gas furnace that also recovers the heat in its exhaust's water vapor, so 90% or more of the gas's energy becomes heat, against about 80% for a non-condensing one."
  - id: gdp-deflator
    term: GDP deflator
    def: "A price index for everything an economy produces; multiplying by the ratio of two years' values turns one year's dollars into another's, such as 2022 dollars into 2025 dollars."
