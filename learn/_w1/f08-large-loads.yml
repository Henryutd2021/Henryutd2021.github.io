id: f08-large-loads
lesson: F8
glossary:
  - id: data-center
    term: Data center
    def: "A building full of computers that store and process data; on the grid it is one large customer that draws power around the clock."
  - id: large-load
    term: Large load
    def: "One customer, such as a data center or a large factory, that draws tens of megawatts or more; utilities and grid operators set their own thresholds."
  - id: power-usage-effectiveness
    term: Power usage effectiveness (PUE)
    def: "A data center's total electricity use divided by the electricity its computing equipment uses; the rest goes to cooling, power conversion and lighting."
  - id: job-year
    term: Job-year
    def: "One person working full time for one year; 100 workers for six months make 50 job-years."
  - id: transfer
    term: Transfer
    def: "A payment, such as a tax, that moves money from one party to another without using up any resources itself."
requests:
