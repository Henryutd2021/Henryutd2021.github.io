# Sidecar for CF3 (cf3-hydrogen-under-uncertainty). Read by the course build step. The two agency names in the
# approved sentence E11.5 stay as approved; these terms spell them out where they are marked.
id: cf3-hydrogen-under-uncertainty
lesson: CF3
glossary:
  - id: weather-zone
    term: Weather zone
    def: "One of the areas into which a grid operator divides its region for weather and demand forecasts; ERCOT has eight."
  - id: future-scenario
    term: Scenario (one possible future)
    def: "One possible future of a model's uncertain inputs, such as how much planned wind and solar gets built and how fast demand grows; each scenario has a chance."
  - id: green-hydrogen
    term: Green hydrogen
    def: "Hydrogen made by electrolysis with renewable electricity, such as wind or solar power, rather than from natural gas."
  - id: eia
    term: EIA
    def: "The Energy Information Administration, the statistics agency of the United States Department of Energy, which publishes data on energy production, use and prices."
  - id: lbnl
    term: LBNL
    def: "Lawrence Berkeley National Laboratory, a laboratory of the United States Department of Energy that publishes, among other datasets, a yearly one of the projects waiting in interconnection queues across the country."
