# Sidecar for Analyst lesson A9 (a09-hazards). Read by the course build step.
id: a09-hazards
lesson: A9
glossary:
  - id: correlated-failure
    term: Correlated failure
    def: "Many parts of a system failing together because they share one cause, such as extreme cold freezing plants and gas supply at once."
  - id: compound-hazard
    term: Compound hazard
    def: "Two or more hazards striking at the same time, such as heat and drought, whose combined harm can exceed the sum of each alone."
  - id: public-safety-power-shutoff
    term: Wildfire safety shutoff
    def: "A utility switching off power lines in dry, windy weather so that they cannot start a fire; the customers on those lines lose power."
  - id: winterization
    term: Winterization
    def: "Protecting power plants and fuel supply against freezing, with insulation, electric heaters on exposed pipes (heat tracing), enclosures and cold-weather procedures."
  - id: stress-test
    term: Stress test
    def: "Running a system model through a severe event on purpose, to see what breaks and what a defence would change."
  - id: derate
    term: Derate
    def: "A cut in the most a power plant can produce while it keeps running, for example when its cooling water is too warm or its equipment freezes."
  - id: firm-load-shed
    term: Firm load shed
    def: "Disconnecting customers whose supply is normally assured, on the grid operator's order and usually in rotation, so that a grid short of supply does not collapse."
