id: a15-efficiency-electrification
lesson: A15
glossary:
  - id: cost-of-saved-energy
    term: Cost of saved energy
    def: "What a measure costs per unit of energy it saves: its extra cost spread over its life at a discount rate, divided by the energy it saves each year."
  - id: heat-pump-water-heater
    term: Heat-pump water heater
    def: "A water heater that moves heat from the surrounding air into the tank, using a fraction of the electricity an electric-resistance heater needs."
  - id: design-day
    term: Design day
    def: "A cold (or hot) day of planning weather, colder than most, for which heating systems and the wires that feed them are sized."
  - id: coincident-peak
    term: Coincident peak
    def: "The most a group of customers draws in the same hour; it is lower than the sum of their own peaks when they peak at different times."
  - id: process-heat
    term: Process heat
    def: "Heat that factories use to make things, such as hot water for washing, steam for cooking and drying, or ovens and furnaces above a few hundred degrees."
