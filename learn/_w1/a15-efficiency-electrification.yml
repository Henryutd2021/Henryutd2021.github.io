id: a15-efficiency-electrification
lesson: A15
glossary:
  - id: cost-of-saved-energy
    term: Cost of saved energy
    def: "What a measure costs per unit of energy it saves: its extra cost spread over its life at a discount rate, plus any extra yearly cost, divided by the energy it saves each year."
  - id: heat-pump-water-heater
    term: Heat-pump water heater
    def: "A water heater that moves heat from the surrounding air into the tank, using a fraction of the electricity an electric-resistance heater needs."
  - id: design-day
    term: Design day
    def: "A cold (or hot) day chosen for planning, so that equipment and networks are sized for its highest hour rather than for an average day."
  - id: coincident-peak
    term: Coincident peak
    def: "The most a group of customers draws in the same hour; it is lower than the sum of their own peaks when they peak at different times."
  - id: building-envelope
    term: Building envelope
    def: "A building's outer shell, its walls, roof, windows and floor, whose insulation and air sealing set how fast heat leaks out."
  - id: temperature-lift
    term: Temperature lift
    def: "How far a heat pump raises heat: its delivery temperature minus its source temperature, in kelvin (a difference of 1 K equals 1 °C)."
  - id: process-heat
    term: Process heat
    def: "Heat that factories use to make things, such as hot water for washing, steam for cooking and drying, or ovens and furnaces above a few hundred degrees."
