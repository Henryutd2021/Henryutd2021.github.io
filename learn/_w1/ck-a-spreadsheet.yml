# Sidecar for CK-A (ck-a-spreadsheet). Read by the course build step.
id: ck-a-spreadsheet
lesson: CK-A
glossary:
  - id: kw-dc
    term: kW-DC
    def: "A solar array's size as the combined direct-current rated power of its panels at standard test conditions, while its actual output varies with sunlight, temperature and the inverter's limits."
  - id: residual-value
    term: Residual value
    def: "The value an asset is assumed to keep at the end of an analysis, such as the unused years of a battery bought late, counted as a credit in the last year."
  - id: elective-pay
    term: Elective pay
    def: "A rule of United States tax law that lets tax-exempt and governmental bodies, such as school districts, receive the value of certain clean-energy tax credits as a payment from the IRS."
requests:
  - "path.yml: CK-A's after list is the course plan's prerequisites for the Analyst checkpoint: A1, A4, A13 and A15."
  - "The case is the school's solar-plus-storage project only. The town heat-pump programme would need A15's numbers (not live); it can become a second variant later, as CK-M has two."
  - "Downloads: assets/learn/data/ck-a-starter.xlsx and ck-a-worked.xlsx (XLSX with live formulas, written with ck-a-spreadsheet.json by the checkpoint's data build step; standard library only). assets/learn/data/ is in _quarto.yml's resources, so both are published."
