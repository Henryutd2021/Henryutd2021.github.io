# Sidecar for CK-A (ck-a-spreadsheet), builder learn-w5-g, 2026-11-06. Read by scripts/build_learn.py.
id: ck-a-spreadsheet
lesson: CK-A
glossary:
  - id: kw-dc
    term: kW-DC
    def: "A solar array's size as the direct-current rating of its panels at standard test conditions; its AC output, after the inverter, is a little lower."
  - id: residual-value
    term: Residual value
    def: "The value an asset is assumed to keep at the end of an analysis, such as the unused years of a battery bought late, counted as a credit in the last year."
  - id: elective-pay
    term: Elective pay
    def: "A rule of United States tax law that lets tax-exempt and governmental bodies, such as school districts, receive the value of certain clean-energy tax credits as a payment from the IRS."
