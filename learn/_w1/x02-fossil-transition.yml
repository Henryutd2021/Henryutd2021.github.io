glossary:
  - id: lng
    term: Liquefied natural gas (LNG)
    def: "Natural gas cooled until it turns liquid, so that ships can carry it across oceans; it is warmed back into gas where it lands."
  - id: bcf
    term: Billion cubic feet (Bcf)
    def: "A unit of natural-gas volume, a billion cubic feet; EIA often gives gas flows in Bcf a day."
  - id: carbon-capture
    term: Carbon capture and storage (CCS)
    def: "Capturing CO₂ from a source such as a chimney before it reaches the air, and storing it, usually deep underground."
  - id: carbon-removal
    term: Carbon dioxide removal (CDR)
    def: "Taking CO₂ that is already in the air and storing it in trees, soils, rock, minerals or products."
  - id: technology-readiness
    term: Technology readiness level (TRL)
    def: "A scale from 1 (basic principles described) to 9 (proven in operation) for how mature a technology or method is."
