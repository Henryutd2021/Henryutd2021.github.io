# glossary.yml — terms used in the Learn lessons (source for assets/learn/data/glossary.json, written by
# python3 scripts/build_learn.py). One short, plain-English sentence per term; no numbers that need a source.
#   id      lower-case slug, used as the anchor (glossary.html#id) and the JSON key
#   term    as shown to readers
#   short   one sentence
#   lesson  the starter-path lesson where the term is first taught (omit if none yet)

- id: power
  term: Power
  short: "How fast electricity is being made or used at a given moment, measured in watts, kilowatts (kW) or megawatts (MW)."
  lesson: 0
- id: energy
  term: Energy
  short: "An amount of electricity made or used over a stretch of time, equal to power multiplied by time and measured in kilowatt-hours (kWh) or megawatt-hours (MWh)."
  lesson: 0
- id: megawatt
  term: Megawatt (MW)
  short: "A unit of power equal to one million watts, or a thousand kilowatts."
  lesson: 0
- id: megawatt-hour
  term: Megawatt-hour (MWh)
  short: "A unit of energy: one megawatt kept up for one hour, or a thousand kilowatt-hours."
  lesson: 0
- id: kilowatt-hour
  term: Kilowatt-hour (kWh)
  short: "The unit of energy on a household electricity bill: one kilowatt kept up for one hour."
  lesson: 1
- id: demand
  term: Demand (load)
  short: "The total power that all users on a grid draw at a given moment."
  lesson: 0
- id: balancing
  term: Balancing
  short: "Keeping the power that plants make equal to the power that people use, at every moment."
  lesson: 0
- id: frequency
  term: Grid frequency
  short: "The number of cycles per second of the grid's alternating current, 60 hertz (Hz) in North America, which falls when power is short and rises when there is too much."
  lesson: 0
- id: balancing-authority
  term: Balancing authority
  short: "The organisation that keeps supply and demand balanced, moment to moment, in its own part of the grid."
  lesson: 0
- id: dispatch
  term: Dispatch
  short: "Deciding how much power each plant should make, hour by hour or minute by minute."
  lesson: 0
- id: dispatchable
  term: Dispatchable plant
  short: "A power plant whose output the operator can turn up or down on request, such as a gas plant."
  lesson: 0
- id: variable-renewables
  term: Variable renewables
  short: "Wind and solar power, whose output follows the weather: they can be turned down but not up."
  lesson: 0
- id: curtailment
  term: Curtailment (spilling)
  short: "Turning a wind or solar farm below what the weather allows, usually because the grid has more power than it can use at that moment."
  lesson: 0
- id: unserved-energy
  term: Unserved energy
  short: "Demand that could not be met, so some customers lost power."
  lesson: 0
- id: ramp-rate
  term: Ramp rate
  short: "How fast a power plant can raise or lower its output, for example in megawatts per minute or per hour."
  lesson: 0
- id: combined-cycle
  term: Combined-cycle plant
  short: "A gas power plant that burns gas in a turbine and uses the hot exhaust to make steam for a second turbine, so it gets more electricity from the same fuel."
  lesson: 0
- id: peaker
  term: Peaker
  short: "A power plant that runs only in the hours of highest demand, because it starts quickly but is expensive to run."
  lesson: 0
- id: running-cost
  term: Running cost
  short: "What it costs a plant to make one more megawatt-hour, mostly fuel, leaving out the cost of building it."
  lesson: 0
- id: merit-order
  term: Merit order
  short: "Running power plants in order of their running cost, cheapest first."
  lesson: 0
- id: capacity
  term: Capacity
  short: "The most power a plant can produce at once, often called its nameplate size."
  lesson: 5
- id: capacity-factor
  term: Capacity factor
  short: "The energy a plant actually made over a period, divided by the energy it would have made running at full capacity the whole time."
  lesson: 5
- id: reserves
  term: Reserves
  short: "Spare capacity that operators keep ready to cover the sudden loss of a plant or a forecast that misses."
  lesson: 3
- id: forecast-error
  term: Forecast error
  short: "The difference between what was forecast, such as tomorrow's demand or wind, and what actually happened."
  lesson: 4
- id: duck-curve
  term: Duck curve
  short: "The daily shape of demand minus solar output, with a dip at midday and a steep climb in the evening."
  lesson: 2
- id: firm-capacity
  term: Firm capacity
  short: "Power that can be counted on whenever it is needed, whatever the weather."
  lesson: 6
- id: lcoe
  term: Levelized cost of electricity (LCOE)
  short: "A plant's lifetime costs divided by the electricity it makes over its life, both discounted to today's money, giving an average cost per megawatt-hour."
  lesson: 7
- id: wholesale-price
  term: Wholesale price
  short: "The price at which electricity is traded between power plants and the companies that sell it to customers, often set hour by hour."
  lesson: 8
- id: energy-storage
  term: Energy storage
  short: "Equipment, such as a battery, that takes in electricity at one time and gives it back later, with some losses."
  lesson: 9
- id: round-trip-efficiency
  term: Round-trip efficiency
  short: "The share of the energy put into storage that comes back out."
  lesson: 9
- id: optimization
  term: Optimization
  short: "Finding the best choice among many, given a goal and the rules the choice must obey."
  lesson: 10
- id: decision-variable
  term: Decision variable
  short: "A quantity the model is free to choose, such as how much each plant makes each hour."
  lesson: 10
- id: objective
  term: Objective
  short: "What an optimization tries to make as small or as large as possible, such as the total cost."
  lesson: 10
- id: constraint
  term: Constraint
  short: "A rule every solution must obey, such as supply equals demand or no plant above its size."
  lesson: 10
- id: linear-program
  term: Linear program
  short: "An optimization problem in which the goal and all the rules are linear, so each is a sum of quantities times fixed numbers."
  lesson: 10
- id: solver
  term: Solver
  short: "Software that finds the best solution of an optimization problem, or shows that none exists."
  lesson: 11
- id: shadow-price
  term: Shadow price
  short: "How much the best total cost would change if one rule were loosened by one unit; for the rule that supply equals demand, it is the price of one more megawatt-hour."
  lesson: 11
- id: pareto-frontier
  term: Pareto frontier
  short: "The set of plans that cannot be made cheaper without becoming dirtier, or cleaner without becoming more expensive."
  lesson: 12
- id: carbon-intensity
  term: Carbon intensity
  short: "The CO2 emitted for each unit of electricity, for example in tonnes per megawatt-hour."
  lesson: 12
