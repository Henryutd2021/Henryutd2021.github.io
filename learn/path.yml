# ---------- Foundations and Analyst modules; live once a row has status: active
- kind: lesson
  id: a22-tradeoff-explorer
  code: A22
  tier: analyst
  form: play
  icon: scale
  status: active
  minutes: 25
  practice_minutes: 20   # the practice set (Check section)
  title: "Cheap, clean, reliable, fair, secure: can you have them all?"
  subtitle: "Watch five goals move at once, find the plans nothing beats, and see whose priorities choose"
  short: "Five goals at once"
  outcome: "Compare plans on five goals at once, find the ones no other plan beats, and show how weights, definitions and limits decide the rest."
