# ---------- the starter path: 14 lessons, the guided tour across the tiers
- kind: lesson
  id: 00-grid-operator
  starter: 0
  form: play
  icon: gauge
  tier: foundations
  status: active
  path: 00-grid-operator.qmd
  minutes: 15
  title: "How does the grid keep the lights on?"
  subtitle: "Be the grid operator for a day"
  short: "Be the grid operator"
  teaches: [balancing supply and demand, power and energy, dispatchable and variable generation, merit order dispatch]
  lab: "load and plot a year of hourly U.S. grid data in Python (bridge B2)."
  does: "Run Prairie Town's power plants hour by hour for one day and keep supply equal to demand."
  outcome: "Say what balancing means and why cheap plants run first."
  after: []
  scales: [S2]
- kind: lesson
  id: 01-power-energy
  starter: 1
  form: cards
  icon: bolt
  tier: foundations
  status: active
  path: 01-power-energy.qmd
  minutes: 15
  title: "Power or energy? What is the difference between kW and kWh?"
  subtitle: "Switch a home's appliances on and watch power and energy part ways"
  short: "Power or energy?"
  does: "An appliance board with live power and the energy it adds up, and a ladder of scales from a phone to the whole country."
  outcome: "Convert between units and make quick estimates."
  after: []
  scales: [S0]
- kind: lesson
  id: 02-demand
  starter: 2
  form: cards
  icon: curve
  tier: foundations
  status: active
  path: 02-demand.qmd
  minutes: 15
  title: "Why does electricity demand rise and fall?"
  subtitle: "Read a real year of demand, then add solar and dig the duck curve"
  short: "The shape of demand"
  does: "Daily, weekly and seasonal demand curves, and a solar slider that digs the “duck curve”."
  outcome: "Read a demand curve and explain its peaks."
  after: [1]
  scales: [S2, S0]
- kind: lesson
  id: 03-balancing
  starter: 3
  form: cards
  icon: wave
  tier: foundations
  status: active
  minutes: 15
  title: "How does the grid stay balanced every second?"
  subtitle: "Trip a plant and watch the grid catch it"
  teaches: [frequency, inertia, primary frequency response, automatic generation control, operating reserves, under-frequency load shedding]
  short: "Balancing every second"
  does: "Trip a power plant and watch the frequency fall, then the fast response and the reserves step in."
  outcome: "Explain frequency, reserves and why outages can cascade."
  after: [0]
  scales: [S2]
- kind: lesson
  id: 04-forecasts
  starter: 4
  form: cards
  icon: cloud
  tier: foundations
  tier2: analyst
  status: active
  minutes: 15
  title: "Forecasts and surprises: how do you plan for weather you can't see yet?"
  subtitle: "Score a real forecast, then plan for its misses"
  teaches: [demand forecasting, forecast error, persistence baseline, MAE and MAPE, prediction intervals, reserves under uncertainty]
  short: "Forecasts and surprises"
  does: "Forecast against actual demand and wind, a simple baseline to beat, and a band of possibilities instead of one line."
  outcome: "Explain forecast error and why operators hold reserves."
  after: [2, 3]
  scales: [S2]
- kind: lesson
  id: 05-capacity-factor
  starter: 5
  form: cards
  icon: turbine
  tier: foundations
  status: active
  path: 05-capacity-factor.qmd
  minutes: 15
  title: "Capacity factor: why is 1 MW not always 1 MW?"
  subtitle: "Run three 100 MW plants for a year and count what they make"
  teaches: [capacity factor, power and energy over a year, the wind power curve and the cube law]
  lab: "compute capacity factors from a year of hourly data in Python (bridge B2)."
  short: "Capacity factor"
  does: "A year of output from nuclear, wind and solar plants of equal size; double a light wind's speed and get eight times the power."
  outcome: "Turn a plant's size in MW into the energy it makes in a year."
  after: [1]
  scales: [S0]
- kind: lesson
  id: 06-three-jobs
  starter: 6
  form: cards
  icon: blocks
  tier: foundations
  status: active
  path: 06-three-jobs.qmd
  minutes: 15
  title: "Cheap energy, firm capacity, flexibility: which plant does which job?"
  subtitle: "Sort the technologies by the jobs they do"
  teaches: [the three jobs of a power system, capacity factor against firm share, comparing technologies by the job they do]
  short: "Three jobs"
  does: "Sort technologies into the jobs they do, with key numbers for each."
  outcome: "Compare technologies by the job they do."
  after: [4, 5]
  scales: [S2]
- kind: lesson
  id: 07-cost
  starter: 7
  form: cards
  icon: coin
  tier: analyst
  status: active
  path: 07-cost.qmd
  minutes: 15
  title: "What does electricity cost to make?"
  subtitle: "Split a plant's costs, discount the future and build a levelized cost"
  short: "What it costs"
  does: "Building, fuel and upkeep; a discounting slider; a levelized-cost calculator, and what it misses."
  outcome: "Compute a levelized cost of electricity and say what it leaves out."
  after: [5]
  scales: [S0]
- kind: lesson
  id: 08-merit-order
  starter: 8
  form: cards
  icon: stairs
  tier: analyst
  status: active
  path: 08-merit-order.qmd
  minutes: 15
  title: "Who runs, and what sets the price?"
  subtitle: "Build Prairie Town's supply stack and find the price"
  short: "Merit order"
  does: "A supply stack, a demand line and the price where they meet; add wind and watch prices fall."
  outcome: "Explain wholesale prices and price spikes."
  after: [6, 7]
  scales: [S2]
- kind: lesson
  id: 09-storage
  status: active
  starter: 9
  form: cards
  icon: battery
  tier: analyst
  minutes: 15
  title: "How does storage move energy through time?"
  subtitle: "Charge with midday sun, discharge at sunset"
  teaches: [energy storage, round-trip efficiency, state of charge, valuing storage, linear programming]
  short: "Storage"
  does: "A battery with power and energy ratings and losses: charge cheap, sell dear, then compare with the best schedule."
  outcome: "Size and value simple storage."
  after: [2, 8]
  scales: [S0, S2]
- kind: lesson
  id: 10-write-it-down
  status: active
  starter: 10
  form: cards
  icon: pencil
  tier: analyst
  minutes: 15
  title: "Write it down: what are the decisions, the goal and the rules?"
  subtitle: "Sort a model into its parts, then find the best plan on a graph"
  teaches: [decision variables, objective, constraints, parameters, feasible region, linear programming outcomes]
  short: "Write it down"
  does: "Sort Prairie Town's choices into decisions, goal and rules, then find the best plan for two plants on a graph."
  outcome: "Formulate a small optimization problem in words and symbols."
  after: [0, 8]
  scales: [S2]
- kind: lesson
  id: 11-solver
  status: active
  starter: 11
  form: cards
  icon: target
  tier: modeler
  minutes: 15
  title: "Ask the solver, then check its answer"
  subtitle: "HiGHS in your browser: solve, check, and read prices"
  teaches: [solvers, model checking, shadow prices, sensitivity analysis, mixed-integer programming]
  short: "Ask the solver"
  does: "A real solver in your browser: try to beat it, check its answer, and read prices from it."
  outcome: "Solve, interpret and check a linear program."
  after: [10]
  scales: [S2]
- kind: lesson
  id: 12-trade-offs
  starter: 12
  form: cards
  icon: frontier
  tier: analyst
  status: active
  path: 12-trade-offs.qmd
  minutes: 15
  title: "Cheap or clean? How do you weigh cost against emissions?"
  subtitle: "Spot the plan nobody should pick, slide a carbon price, and trace the frontier with a solver"
  short: "Cheap or clean?"
  does: "Spot the plans nobody should pick, slide a carbon price, and trace the frontier between cost and CO₂."
  outcome: "Reason about trade-offs between goals."
  after: [11]
  scales: [S2]
- kind: lesson
  id: 13-capstone
  starter: 13
  form: play
  icon: blueprint
  tier: modeler
  tier2: analyst
  status: active
  path: 13-capstone.qmd
  minutes: 15
  title: "What should Prairie Town build? Plan its power system"
  subtitle: "Choose what to build, run a year of real weather, and ask the optimizer"
  short: "Capstone: plan the town"
  does: "Choose how much wind, solar, gas, nuclear and battery to build, then ask the optimizer for the cheapest plan under a CO₂ cap."
  outcome: "Reason about planning trade-offs and know what real planning models do."
  after: [9, 12]
  scales: [S2]

# ---------- modules off the starter path: the news lens, the Foundations checkpoint, the bridges into modelling and
#            the first Modeler lesson; live once a row has status: active
- kind: lesson
  id: n01-news-lens
  code: N1
  tier: foundations
  tier2: analyst
  form: cards
  icon: globe
  status: active
  minutes: 20
  title: "How do you read an energy headline like a researcher?"
  subtitle: "Tag, check and weigh three real energy stories"
  short: "Read a headline"
  outcome: "Read an energy headline critically and spot a units or scale error."
  teaches: [reading energy news critically, units and scale checks, counterfactuals and system boundaries, the evidence ladder]
  does: "Dissect a headline: tag phrases with the seven lens questions, run a back-of-envelope check, then write your take in three sentences (claim, what would change your mind, confidence)."
  after: [1]
  next: CK-F
  next_needs: [6]
  scales: [S0, S1, S2, S3, S4]
- kind: lesson
  id: ck-f-estimate
  code: CK-F
  tier: foundations
  form: checkpoint
  icon: check
  status: active
  minutes: 40
  title: "Foundations checkpoint: estimate an unfamiliar situation"
  subtitle: "Nine tasks on situations you have not seen, the last an estimate with units, a range and a check"
  short: "Foundations checkpoint"
  does: "Estimate an unfamiliar situation without hints (for example the electricity for a town's school buses if they went electric): units, a range, the main uncertainty and one way to check the answer."
  after: [6, N1]
- kind: lesson
  id: b01-algebra-to-lp
  code: B1
  tier: analyst
  tier2: modeler
  form: cards
  icon: pencil
  status: active
  minutes: 30
  practice_minutes: 45   # the practice set (Check section), shown in the header badge
  title: "From algebra to a linear program: how do equations become a model?"
  subtitle: "Turn word problems into a linear program, find its best corner on a graph, and hand it to a real solver"
  short: "Algebra to a linear program"
  outcome: "Turn a word problem into a linear program, find its best corner on a graph and write it as Ax <= b."
  teaches: [formulating a linear program, feasible region, Ax <= b form, solver use]
  does: "Start with a ten-question readiness check that routes you to the toolbox if needed; turn three word problems into equations and inequalities, then into a linear program; drag the constraints of a two-variable LP; write the same model as Ax <= b with a linked view."
  after: [10, K4]
  next: B2
  next_needs: [K7]
  scales: [S2]
- kind: lesson
  id: b02-python-data
  code: B2
  tier: analyst
  tier2: modeler
  form: cards
  icon: chart
  status: active
  minutes: 20
  lab_minutes: 60   # the notebook lab (its eyebrow on the page: about 60 minutes)
  title: "Python and data for energy: how do you load, plot and check a year of hourly data?"
  subtitle: "Find the bad hours in a real year of grid data"
  short: "Python and data"
  outcome: "Load, clean, plot and check a year of hourly grid data, and catch bad rows with assert checks."
  teaches: [time stamps and daylight saving, data cleaning, duration curves, capacity factors from data, assert checks]
  lab: "a notebook (about 60 minutes) that repeats every step in pandas, with auto-check cells."
  does: "In a notebook, load a year of hourly grid data, fix time zones and daylight-saving gaps, plot it, compute capacity factors and a duration curve, and write assert checks that catch bad rows."
  after: [5, K7]
  next: B3
  scales: [S0, S2]
- kind: lesson
  id: b03-read-check-formulation
  code: B3
  tier: analyst
  tier2: modeler
  form: cards
  icon: question
  status: active
  minutes: 30
  practice_minutes: 45   # the practice set (Check section), shown in the header badge
  title: "How do you read a formulation, and check that a model is right?"
  subtitle: "Read a dispatch model line by line, hunt five planted bugs, and check a solved model's balance and duals"
  short: "Read and check a formulation"
  outcome: "Read a published formulation line by line, find planted errors and check a solved model's balance and duals."
  teaches: [reading a formulation, sets, parameters and variables, model verification, dual signs]
  does: "Read a published-style formulation (sets, indices, parameters, variables, constraints) and translate each line into words and units; find five planted errors (unit, sign, missing index, wrong sum, a free lunch); check a solved model's energy balance and the signs of its duals."
  after: [B1]
  next: M1
  next_needs: [11]
  scales: [S2]
- kind: lesson
  id: m01-dispatch-to-lmp
  code: M1
  tier: modeler
  form: cards
  icon: tower
  status: active
  minutes: 40
  practice_minutes: 90   # the notebook's practice, after its 45-minute lab (as the page's lab card says)
  lab_minutes: 45   # the notebook lab: in the header badge and timeRequired, as on M2 and M3
  title: "From dispatch to locational prices: the linear program behind the market"
  subtitle: "Solve a day of dispatch, read each hourly price as a dual, then congest a line and watch one price split into three"
  short: "Dispatch to locational prices"
  outcome: "Formulate a dispatch LP, solve it, and explain each bus price as a dual in words."
  teaches: [economic dispatch as a linear program, balance duals, DC power flow, transmission congestion, locational marginal prices]
  lab: "a SciPy/HiGHS notebook that rebuilds the model and asserts the browser's prices, about 45 minutes."
  does: "Build a 24-hour dispatch LP with ramps and read its balance duals as marginal values under stated assumptions; add a three-bus DC power-flow network, congest a line and watch one price split into three."
  after: [11, 8, B1, B2, B3]
  next: M2
  scales: [S2]

# ---------- the hubs of system-ness: the five scales (F1) and the whole system (F2)
- kind: lesson
  id: f01-five-scales
  code: F1
  tier: foundations
  form: cards
  icon: city
  status: active
  minutes: 15
  practice_minutes: 10
  title: "Who decides what, from a light switch to a nation?"
  subtitle: "Zoom from one home to a whole nation, and sort who decides what at each scale"
  short: "Five scales"
  teaches: [system scales, who decides at each scale, what a model needs at each scale, signals and needs passed between scales, local and system optimum]
  does: "A zoom from one home to Prairieland; at each scale, sort who decides, what they decide, what physics a model needs and what passes between scales."
  outcome: "Place a question at its scale and name who decides it, what a model of it needs and what it takes from other scales."
  after: [0]
  next: F2
  next_needs: [6]
  scales: [S0, S1, S2, S3, S4]
- kind: lesson
  id: f02-systems-and-map
  code: F2
  tier: foundations
  tier2: analyst
  form: play
  icon: map
  status: active
  minutes: 25
  practice_minutes: 10
  title: "How does everything connect? Stocks, flows, feedback and the whole-system map"
  subtitle: "Fill a reservoir, close a feedback loop, then pull a lever and watch the whole system ripple"
  short: "Stocks, loops and the system map"
  teaches: [stocks and flows, reinforcing and balancing feedback loops, causal-loop diagrams, the rebound effect, ripple effects across a whole energy system]
  does: "A stock-and-flow simulator (a reservoir, a battery, a carbon budget), a causal-loop builder (chargers and EVs, the rebound effect) and a whole-system map: pull one lever and watch the ripples."
  outcome: "Tell a stock from a flow, name a feedback loop as reinforcing or balancing, and trace how one change ripples across technology, cost, emissions, people and security."
  after: [F1, 6]
  next: A22
  next_needs: [12]
  scales: [S0, S1, S2, S3, S4]
# ---------- Foundations: energy services, power plants, nuclear basics, the grid and outages
- kind: lesson
  id: f03-energy-services
  code: F3
  tier: foundations
  form: cards
  icon: house
  status: active
  minutes: 20
  practice_minutes: 10
  title: "What do people actually want from energy?"
  subtitle: "Walk through a home, sort its energy by service, and swap the furnace for a heat pump on a cold day"
  short: "Energy services"
  teaches: [energy services, energy carriers, final and useful energy, conversion efficiency, the heat pump's coefficient of performance]
  does: "A Prairie Town home's year of energy by service and by carrier, the gap between energy bought and useful energy delivered, and a heat pump whose COP falls on a cold day."
  outcome: "Tell a service from a carrier, estimate the useful energy a home gets from what it buys, and explain why a heat pump's COP changes with the weather."
  after: [1]
  next: F4
  next_needs: [5]
  scales: [S0]
- kind: lesson
  id: f04-power-plants
  code: F4
  tier: foundations
  form: cards
  icon: plant
  status: active
  minutes: 20
  practice_minutes: 10
  title: "How do power plants turn heat, water, wind and sunlight into electricity?"
  subtitle: "Open six plants, follow 100 units of energy to the wire, and compare three real days on a solar farm"
  short: "Power plants"
  teaches: [heat engines and turbines, conversion efficiency and waste heat, hydro head and flow, solar and wind conversion, ramp and reservoir limits]
