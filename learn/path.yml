# ---------- the Modeler checkpoint (curriculum v2 §3.3), wave W2
- kind: lesson
  id: ck-m-unseen-problem
  code: CK-M
  tier: modeler
  form: checkpoint
  icon: check
  status: active
  minutes: 240
  title: "Modeler checkpoint: formulate an unseen problem, find a defect, validate a result"
