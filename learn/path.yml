  id: sb1-microgrid-workbench
  code: SB1
  tier: analyst
  tier2: modeler
  form: sandbox
  icon: battery
  status: active
  minutes: 30
  title: "Microgrid Workbench"
  subtitle: "Island a fictional campus: set what must stay on, size solar, a battery and diesel, and test hypothetical outages on 2025 solar profiles within the feeder's limits"
  short: "Microgrid Workbench"
  outcome: "Build a campus microgrid plan, run it through outage scenarios within the host feeder's limits, and read its cost, unserved load and emissions per scenario."
  teaches: [one-line diagram, islanding, load priorities in an outage, outage scenarios, host-feeder limits, ownership and cost of capital]
  does: "One-line diagram, islanding, outage scenarios, load priorities, host-feeder limits and ownership models, on engine E1: a small mixed-integer program."
  after: [9]
  scales: [S1]
- kind: lesson
  id: c1-keep-the-campus-running
  code: C1
  tier: analyst
  tier2: modeler
  form: capstone
  sandbox: SB1
  icon: house
  status: active
  minutes: 90
  lab_minutes: 60   # the Modeler version adds the M5 notebook
  title: "Keep the campus running: a microgrid for a three-day winter outage"
  subtitle: "Plan the microgrid that keeps power to the hospital, its water and heating plant and the dorms through a winter storm, compare three owners, and hand in a one-page note"
  short: "Keep the campus running"
  outcome: "Recommend a campus microgrid for a three-day winter outage, within the feeder's limits, with its cost, unserved critical load and emissions, a comparison of owners and a sensitivity to the outage's length."
  teaches: [capstone plan and note, cost and unserved critical load on one boundary, ownership and cost of capital, sensitivity to outage length]
  does: "Size Prairie Campus's microgrid (solar, battery, generator, load priorities) to keep power to the hospital, its water and heating plant and the dormitories through a three-day outage; respect the host feeder's limits; compare utility, co-op and community ownership; report cost, unserved critical load and emissions."
  after: [SB1, F7, A14, A4]
  scales: [S1]

# CF3 (approved wording E11); Analyst tier, as CF1 and CF2
- kind: lesson
  id: cf3-hydrogen-under-uncertainty
  code: CF3
  tier: analyst
  form: case
  icon: map
  status: active
  minutes: 10
  title: "Where should hydrogen go when nobody knows how much wind will be built?"
  subtitle: "Why a hydrogen plan sized for one forecast can cost too much in the others, and how a plan that weighs every build-out differs"
  short: "Hydrogen under uncertain wind"
  does: "A case file in six parts and a timeline; then size an electrolyzer before the wind is built and compare the plan for the average, the hedged plan and the worst-case plan in three build-outs."
  outcome: "Say how a two-stage stochastic program sizes equipment before renewable build-out is known, and why its plan differs from a plan for the average future."
  teaches: [sizing before uncertainty resolves, scenarios with chances, reading a published stochastic planning model]
  after: [12]
  scales: [S2]
# CF4 (approved wording E15, with its revisions after review): framing C; analyst tier, as the other case files
- kind: lesson
  id: cf4-existing-reactors-hydrogen
  code: CF4
  tier: analyst
  form: case
  icon: atom
  status: active
  minutes: 10
  title: "Can existing reactors earn more by making hydrogen and providing grid services?"
  subtitle: "Follow one study through six parts, then run a toy plant that sells power, makes hydrogen and holds reserves at prices you set"
  short: "Hydrogen at existing plants"
  does: "A case file in six parts and a timeline; then split a toy plant's output hour by hour between the grid, an electrolyzer and reserves, at prices you set, and see what the day earns against selling all the power."
  outcome: "Say what an hourly dispatch model and a lifetime cash flow each add when judging hydrogen at an existing plant, why the plant's own capital drops out, and which assumptions a result rests on."
  teaches: ["hydrogen at an existing plant", "reserves from an electrolyzer's headroom", "sunk costs", "price-taking", "reading a published dispatch and cash-flow study"]
  after: [7]
  scales: [S4]
# CF5 (approved wording E14): framing C, E14.16b; analyst tier
- kind: lesson
  id: cf5-drawing-the-boundary
  code: CF5
  tier: analyst
  form: case
  icon: scale
  status: active
  minutes: 10
  title: "Where should a cogeneration study's boundary be drawn?"
  subtitle: "Follow one study's boundary through six parts, then move the line yourself around a toy steam plant and its load"
  short: "Drawing the boundary"
  does: "A case file in six parts and a timeline; then move the boundary around a toy steam plant and its load, and see steam cooling look free, costly or worth it."
  outcome: "Say which plant streams, loads and alternatives a cogeneration study must keep inside its boundary to price the steam it sends to cooling."
  teaches: [system boundaries, pricing a diverted by-product, cogeneration, absorption and electric chillers]
  after: [7]
  scales: [S1]
# CF8 (approved wording E12 and E13)
- kind: lesson
  id: cf8-power-curves-from-scarce-data
  code: CF8
  tier: analyst
  form: case
  icon: turbine
  status: active
  minutes: 10
  title: "Learning a wind turbine's power curve from scarce data"
  subtitle: "Why a measured power curve is a band, and how a turbine's theoretical curve can narrow it when records are few"
  short: "Power curves from scarce data"
  does: "A case file in seven parts and a timeline; then turn a power-curve band into a capacity-factor band, and see how the number of records and the theoretical curve change it."
  outcome: "Say why a measured power curve is a band, what a theoretical curve adds when records are few, and why the verdict depends on the score."
  teaches: [probabilistic power curves, multi-fidelity data, from a power-curve band to a capacity-factor band]
  after: [5]
  scales: [S0]
# ---------- the math toolbox (K1-K8; guided minutes)
- kind: tool
  id: k01-units
  code: K1
  form: cards
  path: k01-units.qmd
  status: active
  minutes: 10
  practice_minutes: 10
  title: "Units and orders of magnitude"
  subtitle: "Climb the prefix ladder, let units cancel, and size any number by its power of ten"
  short: "Units and magnitudes"
  does: "Convert between kW, MW and GW and between power and energy, carry units through a calculation so they cancel, and place a phone charge, a town's day and a nation's year on one powers-of-ten scale."
  outcome: "Convert power and energy units with prefixes, check a result by its units, and estimate a quantity to the nearest power of ten."
  teaches: [SI prefixes, power and energy units, unit cancelling, scientific notation, orders of magnitude]
  after: []
  next: K2

- kind: tool
  id: k02-rates-efficiencies
  code: K2
  form: cards
  path: k02-rates-efficiencies.qmd
  status: active
  minutes: 10
  practice_minutes: 10
  title: "Rates and efficiencies"
  subtitle: "Chain per-unit numbers, turn a heat rate into an efficiency, and follow the losses"
  short: "Rates and efficiencies"
  does: "Multiply rates through a chain (MMBtu per MWh times dollars per MMBtu), turn a gas plant's heat rate into an efficiency, follow energy through a battery's round trip, and get a capacity factor from a year's output."
  outcome: "Use rates and efficiencies with their units: fuel cost and CO₂ per MWh from a heat rate, losses through a chain, and capacity factors."
  teaches: [rates and per-unit numbers, heat rate and efficiency, chained efficiencies, round-trip efficiency, capacity factor as a ratio]
  after: [K1]
  next: K3

- kind: tool
  id: k03-discounting
  code: K3
  form: cards
  path: k03-discounting.qmd
  status: active
  minutes: 15
  practice_minutes: 15
  title: "Exponentials and discounting"
  subtitle: "Grow money forward, discount it back, and spread a building cost into equal yearly payments"
  short: "Exponentials and discounting"
  does: "Watch growth compound, discount future dollars to today, add up a stream of equal payments, and build the capital recovery factor that lessons 7, 12 and 13 use to turn a building cost into a yearly cost."
  outcome: "Compute present values and the capital recovery factor, and turn a building cost into an annualised cost."
  teaches: [compound growth, present value, discount rate, annuities, capital recovery factor]
  after: []
  next: 7
  next_needs: [5]

- kind: tool
  id: k04-linear-equations
  code: K4
  status: active
  minutes: 15
  practice_minutes: 20   # the drill (Check section), shown in the header badge
  title: "Linear equations and inequalities"
  subtitle: "Solve a balance for one unknown, turn words into ≤, ≥ and =, and find the plans that pass several rules at once"
  short: "Linear equations"
  outcome: "Solve a balance for one unknown and read a set of inequalities as the region of plans that pass them."
  teaches: [linear equations, inequalities, half-planes, systems of rules]
  next: B1
  next_needs: [10]

- kind: tool
  id: k05-probability-statistics
  code: K5
  form: cards
  path: k05-probability-statistics.qmd
  status: active
  minutes: 25
  practice_minutes: 30
  title: "Probability and statistics"
  subtitle: "Read four months of real forecast errors as a distribution: centre, spread, tails and chance"
  short: "Probability and statistics"
  does: "With a grid operator's real day-ahead forecast errors, build a histogram, compare mean and median, measure spread, read percentiles and intervals, and estimate a chance by counting and by sampling; then combine two plants' outages into a joint chance and an expected value."
  outcome: "Describe a distribution by its centre, spread and quantiles, estimate a probability from data, and say when probabilities multiply."
  teaches: [histograms, mean and median, standard deviation and percentiles, probability as frequency, sampling and Monte Carlo, independence and expected value]
  after: []
  next: 4
  next_needs: [2, 3]

- kind: tool
  id: k06-vectors-matrices
  code: K6
  form: cards
  path: k06-vectors-matrices.qmd
  status: active
  minutes: 25
  practice_minutes: 30
  title: "Vectors and matrices: what Ax ≤ b means"
  subtitle: "Write a plan as a vector and the rules as a matrix, then check every rule at once"
  short: "Vectors and matrices"
  does: "On lesson 10's hour, write a plan as a vector and its cost as a dot product, stack the rules into a matrix, compute A x, flip a ≥ row to ≤, check every rule at once, and size the matrix of lesson 11's day."
  outcome: "Read and compute a dot product and a matrix-vector product, and read A x ≤ b as one row per rule checked at once."
  teaches: [vectors, the dot product, matrices, matrix-vector products, the form A x ≤ b, sparse matrices]
  after: [K4]
  next: B1
  next_needs: [10]

- kind: tool
  id: k07-spreadsheets
  code: K7
  status: active
  minutes: 20
  title: "Spreadsheets in practice"
  subtitle: "Work through Prairie Town's real day in a spreadsheet: formulas, fill-down, absolute references and a check cell"
  short: "Spreadsheets"
  outcome: "Build a small energy calculation in a spreadsheet with relative and absolute references and a check cell."
  teaches: [cell references, fill-down, absolute references, SUM and MAX, check cells]
  next: B2
  next_needs: [5]

- kind: tool
  id: k08-git-notebooks
  code: K8
  form: cards
  path: k08-git-notebooks.qmd
  status: active
  minutes: 20
  practice_minutes: 30
  title: "Git and reproducible notebooks"
  subtitle: "Commit, compare and rewind a small model project, then make its notebook rerun cleanly"
  short: "Git and notebooks"
  does: "In a simulated project, stage and commit changes, read a diff, go back to find the commit that broke a result, try an idea on a branch, and make a notebook rerun cleanly from top to bottom with pinned inputs."
  outcome: "Explain commits, diffs, branches and clean reruns, and apply a reproducibility checklist to a model project."
  teaches: [version control, commits and diffs, branches, notebook hidden state, reproducible environments]
  after: []
  next: M1
  next_needs: [8, 11, B1, B2, B3]
