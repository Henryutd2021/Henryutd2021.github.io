- kind: lesson
  id: m02-unit-commitment
  path: m02-unit-commitment.qmd
  code: M2
  tier: modeler
  form: cards
  icon: lamp
  status: active
  minutes: 40
  practice_minutes: 90   # the notebook's practice questions, after its 45-minute lab
  lab_minutes: 45   # the notebook lab: build_learn.py adds it to the header badge and timeRequired
  title: "On or off? Unit commitment as a mixed-integer program"
  subtitle: "Switch the gas plants on and off, grow a branch-and-bound tree, and see what the prices leave unpaid"
  short: "Unit commitment"
  outcome: "Formulate a unit commitment with start-up costs and minimum run times, solve it by branch and bound, and price it with the switches fixed, stating what the prices leave unpaid."
  teaches: [unit commitment, mixed-integer programming, LP relaxation, branch and bound, conditional prices, uplift payments]
  lab: "a SciPy/HiGHS notebook that rebuilds the model, grows the same tree and asserts the browser's numbers, about 45 minutes."
  does: "Add start-up costs and minimum run times; watch the LP schedule become impossible to operate; grow a small branch-and-bound tree; see why a mixed-integer program gives no ordinary shadow prices; fix the commitments and re-solve the dispatch LP for conditional prices, then count the uplift payments that start-up costs need."
  after: [M1]
  next: M3
- kind: lesson
  id: m03-capacity-expansion
  code: M3
  tier: modeler
  form: cards
  icon: blueprint
  status: active
  minutes: 45
  practice_minutes: 120
  lab_minutes: 60   # the notebook lab (learn_map_v2.yml): in the header badge and timeRequired
  title: "What should be built? Capacity expansion with representative periods, validated"
  subtitle: "Plan on a few weeks, then test the plan on every hour of two weather years"
  short: "Capacity expansion, validated"
  outcome: "Formulate a capacity-expansion LP on weighted representative weeks with a linked battery, and validate its plan on full years with stated error measures."
  teaches: [capacity expansion as a linear program, representative periods and weights, storage linked across periods, validation on full weather years, error measures]
  lab: "a SciPy/HiGHS notebook that rebuilds the model and checks its own plans against the reference results, about 60 minutes, then 120 minutes of practice."
  does: "Co-optimize what to build and how to run it on weighted representative weeks, with the battery linked across them and the extreme weeks kept; then re-run the plan on every hour of 2025 and of 2024 and see which conclusions survive."
  after: [M1, 7, 13]
  next: CK-M
