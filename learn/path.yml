  teaches: [researchable questions, the five question types, audience and decision-maker, metrics with units, counterfactuals, falsification statements]
  does: "Sort twenty questions into researchable, too vague, already answered and not answerable with the data at hand; name each one's type; rewrite three with an audience, a metric and a counterfactual."
  outcome: "Turn a vague concern into a typed question with an audience, a metric with units, a counterfactual, a scale and boundary, and a falsification statement."
