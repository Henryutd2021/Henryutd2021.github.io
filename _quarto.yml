project:
  type: website
  output-dir: _site
  # after every render: SRI on the MathJax tag Quarto writes, and its ES6 polyfill removed (security hardening, 2026-11-07)
  post-render: _post_render.py
  render:            # explicit allowlist: only these pages are rendered and published
    - index.qmd
    - research.qmd
    - projects.qmd
    - projects/*.qmd
    - publications.qmd
    - software-data.qmd
    # notes.qmd and notes/*.qmd are hidden until there is content
    - teaching.qmd
    - cv.qmd
    # Field Notes; draft posts are skipped automatically
    - field-notes.qmd
    - field-notes/briefings.qmd
    - field-notes/briefings/*.qmd
    - field-notes/data-tools.qmd
    - field-notes/perspectives.qmd
    - field-notes/perspectives/*.qmd
    # Learn: the course index and every lesson page
    - learn/index.qmd
    - learn/*.qmd
    # Journeys (personal travel log): body generated by the journeys build step from data/journeys.json
    - journeys.qmd
    # the page GitHub Pages serves for a missing address (404.html at the site root; not in the sitemap, not indexed)
    - 404.qmd
  resources:
    - robots.txt
    - google10b8e69b53ee897d.html   # Google Search Console file verification
    - images/
    - files/
    - assets/explainers/
    - assets/learn/*.js
    - assets/learn/data/
    - assets/learn/vendor/      # HiGHS (WebAssembly, MIT) for the in-browser solver; loaded only when a lesson solves
    - assets/journeys/          # Journeys page script and styles (loaded only by journeys.qmd)

website:
  title: "Honglin Li"
  site-url: "https://henryutd2021.github.io"
  description: "Energy systems optimization and techno-economic analysis"
  favicon: images/favicon.svg
  open-graph: true
  # the shared preview image as an absolute address: a relative path is resolved against each page's folder, so
  # nested pages (Learn, Field Notes) pointed at a file that does not exist; the post-render step checks every og:image
  image: https://henryutd2021.github.io/images/profile-square.jpg
  navbar:
    # nine links and five icons need about 1,050 px; below 1,200 px they truncate the site name and wrap "Field Notes",
    # so the menu collapses there (Quarto's default is below 992 px)
    # Journeys added (2026-11-05): ten links did not fit at 1,200 px, so "About" left the list; the brand (name) at the
    # left is the link to the About page (assets/site.js gives it the accessible name "Honglin Li, home"); "Field Notes"
    # still wrapped at 1,200 px, so its navbar label is "Notes"
    collapse-below: xl
    left:
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: publications.qmd
        text: Publications
      - href: software-data.qmd
        text: Software
      - href: teaching.qmd
        text: Teaching
      - href: learn/index.qmd
        text: Learn
      - href: field-notes.qmd
        text: Notes   # short label in the navbar only (2026-11-05: "Field Notes" wrapped at 1,200 px with Journeys); the page,
                      # its title and URL stay "Field Notes" (assets/site.js names the link "Field Notes" for screen readers)
      - href: cv.qmd
        text: CV
      - href: journeys.qmd
        text: Journeys
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=O1BZdHQAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/Henryutd2021
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/honglin-li-998b18221/
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Honglin Li · Kansas State University · [hlli@ksu.edu](mailto:hlli@ksu.edu)"
    right: "Last updated: November 2026 · Built with [Quarto](https://quarto.org)"

format:
  html:
    # day theme by default, night theme via the navbar toggle (third redesign, 2026-10-30); tokens in assets/base.css
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: [assets/base.css, assets/home.css, assets/pubs.css, assets/pages.css, assets/map.css, assets/explainers.css]
    # the first lines of every <head>: Quarto's metadata partial plus a small script that runs before all others and, when
    # the browser refuses site storage, gives the page an in-memory store for the visit (so the theme switch and the page
    # scripts do not stop with an error); with working storage it changes nothing. A page's own include-in-header does
    # not replace it
    template-partials: [assets/head/metadata.html]
    # MathJax pinned to an exact version (Quarto's default is the moving mathjax@4); its SRI hash is in _post_render.py
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js"
    # Security hardening (2026-11-07): a Content-Security-Policy and referrer policy for every page, and SRI on every
    # pinned CDN file. index.qmd has its own include-in-header (it replaces this one), so it repeats these lines: the same
    # policy plus what the MapMyVisitors widget on that page needs ('unsafe-eval', mapmyvisitors.com, code.jquery.com).
    # object-src is 'self', not 'none': the CV page shows the CV PDF in an <object>.
    # Hashes and the two policies are checked by the SRI step (its update mode after a version bump).
    include-in-header:
      text: |
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
        <meta name="referrer" content="strict-origin-when-cross-origin">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css" integrity="sha384-cxs0Bj979VdNByRZzAJ2KJWG8vH/kG7fwWZAIZW3Tmsw0rAuP/pu3I3LitFWEs18" crossorigin="anonymous">
        <meta name="theme-color" content="#ffffff">
    include-after-body: [assets/site-js.html, assets/pages-js.html, assets/home-js.html, assets/map-js.html]   # inline JS (written by the site build step from assets/*.js)
    toc: false
    smooth-scroll: false
    # one absolute canonical link per page, from site-url (directory indexes end in /); the post-render step adds a
    # matching og:url and writes the sitemap with the same addresses
    canonical-url: true
    # without JavaScript the collapsed navbar (below 1,200 px) cannot open: the links are shown as an open menu instead,
    # in a header that scrolls away with the page (the open menu is too tall to stay pinned on a phone), and the
    # controls that need JavaScript (menu button, day/night switch) are hidden; with JavaScript nothing changes
    include-before-body:
      text: |
        <noscript><style>@media (max-width: 1199.98px) { #quarto-header { position: relative; } #quarto-header .navbar-toggler { display: none; } #quarto-header #navbarCollapse { display: block !important; } } #quarto-header .quarto-navbar-tools { display: none; }</style></noscript>
