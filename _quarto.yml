project:
  type: website
  output-dir: _site
  render:            # explicit allowlist: only these pages are rendered and published
    - index.qmd
    - research.qmd
    - projects.qmd
    - projects/*.qmd
    - publications.qmd
    - software-data.qmd
    # notes.qmd and notes/*.qmd are hidden until there is content (Henry 2026-10-21)
    - teaching.qmd
    - cv.qmd
    # Field Notes (website v3); draft posts are skipped automatically
    - field-notes.qmd
    - field-notes/briefings.qmd
    - field-notes/briefings/*.qmd
    - field-notes/data-tools.qmd
    - field-notes/perspectives.qmd
    - field-notes/perspectives/*.qmd
  resources:
    - robots.txt
    - google10b8e69b53ee897d.html   # Google Search Console file verification
    - images/
    - files/
    - assets/explainers/

website:
  title: "Honglin Li"
  site-url: "https://henryutd2021.github.io"
  description: "Energy systems optimization and techno-economic analysis"
  favicon: images/favicon.svg
  open-graph: true
  image: images/profile-square.jpg
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: publications.qmd
        text: Publications
      - href: software-data.qmd
        text: Software
      - href: teaching.qmd
        text: Teaching
      - href: field-notes.qmd
        text: Field Notes
      - href: cv.qmd
        text: CV
    right:
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=O1BZdHQAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/Henryutd2021
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/honglin-li-998b18221/
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Honglin Li · Kansas State University · [hlli@ksu.edu](mailto:hlli@ksu.edu)"
    right: "Last updated: November 2026 · Built with [Quarto](https://quarto.org)"

format:
  html:
    # day theme by default, night theme via the navbar toggle (third redesign, 2026-10-30); tokens in assets/base.css
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: [assets/base.css, assets/home.css, assets/pubs.css, assets/pages.css, assets/map.css, assets/explainers.css]
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.4/css/academicons.min.css" crossorigin="anonymous">
        <meta name="theme-color" content="#ffffff">
    include-after-body: [assets/site-js.html, assets/pages-js.html, assets/home-js.html, assets/map-js.html]   # inline JS (written by scripts/build_site.py from assets/*.js)
    toc: false
    smooth-scroll: false
